<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO WORLD — The Geography Knowledge Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEE8D6;
    --paper-deep:#E4DCC4;
    --ink:#1C2A2E;
    --ink-soft:#5B6A64;
    --line:#CBC1A2;
    --green:#2F6F5E;
    --green-deep:#20493D;
    --gold:#B98A34;
    --rust:#A6491F;
    --card:#F7F3E6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  ::selection{background:var(--gold);color:var(--paper);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:340px;
    min-width:340px;
    background:var(--paper-deep);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:100%;
  }
  #masthead{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    position:relative;
    background:
      radial-gradient(circle at 88% 18%, rgba(47,111,94,0.10) 0, transparent 45%),
      var(--paper-deep);
  }
  #masthead svg.contours{
    position:absolute;top:0;right:0;width:150px;height:100%;opacity:0.35;pointer-events:none;
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    color:var(--green-deep);
    margin:0;
  }
  .wordmark span{color:var(--rust);}
  .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
    line-height:1.4;
    max-width:230px;
  }
  #tabs{
    display:flex;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    flex:1;
    padding:11px 8px;
    background:none;
    border:none;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--green-deep);border-bottom-color:var(--green);}

  #search-wrap{padding:14px 16px 8px;}
  #search{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:5px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  #search:focus{border-color:var(--green);}
  #meta-count{
    font-size:11.5px;
    color:var(--ink-soft);
    padding:0 16px 8px;
  }

  #tree-scroll{
    flex:1;
    overflow-y:auto;
    padding:4px 10px 24px;
  }
  #tree-scroll::-webkit-scrollbar{width:8px;}
  #tree-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .part-block{margin-bottom:2px;}
  .part-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:9px 8px;
    cursor:pointer;
    border-radius:4px;
    user-select:none;
  }
  .part-head:hover{background:rgba(47,111,94,0.08);}
  .part-roman{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--green);
    min-width:26px;
  }
  .part-title{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    flex:1;
  }
  .chev{
    font-size:10px;
    color:var(--ink-soft);
    transition:transform .15s;
  }
  .part-block.open .chev{transform:rotate(90deg);}
  .sections{
    display:none;
    padding-left:26px;
    border-left:1px solid var(--line);
    margin-left:12px;
  }
  .part-block.open .sections{display:block;}
  .section-row{
    padding:6px 8px;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:4px;
  }
  .section-row:hover{background:rgba(47,111,94,0.08);color:var(--ink);}
  .section-row.active{background:var(--green);color:var(--card);}
  .section-num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:0.75;margin-right:5px;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    overflow-y:auto;
    height:100%;
  }
  #main::-webkit-scrollbar{width:10px;}
  #main::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}

  .page{padding:44px 56px 80px;max-width:900px;}

  .crumb{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .crumb b{color:var(--green-deep);}

  h1.topic-title{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:36px;
    line-height:1.15;
    color:var(--green-deep);
    margin:0 0 8px;
    max-width:640px;
  }
  .topic-sub{
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:600px;
    line-height:1.55;
    margin-bottom:28px;
  }

  .term-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:10px;
    margin-top:6px;
  }
  .sub-heading{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin:30px 0 12px;
  }
  .term-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:11px 13px;
    font-size:13.5px;
    color:var(--ink);
    line-height:1.4;
    position:relative;
  }
  .term-card::before{
    content:"";
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    margin-right:8px;
    vertical-align:middle;
  }

  .welcome-hero{
    max-width:640px;
  }
  .welcome-hero .big-stat{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:64px;
    color:var(--green-deep);
    line-height:1;
    margin:18px 0 4px;
  }
  .welcome-hero .big-stat-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .stat-row{display:flex;gap:36px;margin:26px 0 34px;flex-wrap:wrap;}
  .stat-row div{min-width:110px;}
  .stat-row .n{font-family:'Fraunces',serif;font-weight:600;font-size:28px;color:var(--rust);}
  .stat-row .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .part-index{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:8px;
    margin-top:10px;
  }
  .part-index a{
    display:block;
    padding:10px 13px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    text-decoration:none;
    color:var(--ink);
    font-size:12.5px;
    cursor:pointer;
  }
  .part-index a:hover{border-color:var(--green);}
  .part-index a b{
    display:block;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:14px;
    color:var(--green-deep);
    margin-bottom:2px;
  }

  /* ---------- Country explorer ---------- */
  #country-search-wrap{padding:14px 16px 8px;}
  #country-search{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:5px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  #country-search:focus{border-color:var(--green);}
  #country-filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;}
  .country-filter{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:20px;
    padding:5px 10px;
    font-size:11px;
    font-family:'IBM Plex Sans',sans-serif;
    cursor:pointer;
  }
  .country-filter:hover{border-color:var(--green);}
  .country-filter.active{background:var(--green);color:var(--card);border-color:var(--green);}
  .country-empty{padding:16px;font-size:13px;color:var(--ink-soft);}
  .country-flag{
    display:inline-block;
    height:0.72em;
    width:auto;
    vertical-align:baseline;
    margin-right:12px;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.12);
  }
  .country-list{padding:6px 6px 20px;}
  .country-btn{
    display:block;
    width:100%;
    text-align:left;
    padding:10px 12px;
    background:none;
    border:none;
    border-radius:5px;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .country-btn:hover{background:rgba(47,111,94,0.08);}
  .country-btn.active{background:var(--green);color:var(--card);}
  .country-btn small{display:block;font-size:11px;color:inherit;opacity:0.7;margin-top:1px;}

  .profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-top:24px;
  }
  .profile-field{
    background:var(--card);
    padding:14px 18px;
  }
  .profile-field .k{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--gold);
    margin-bottom:4px;
  }
  .profile-field .v{font-size:14px;color:var(--ink);line-height:1.4;}

  .empty-note{
    font-size:12px;
    color:var(--ink-soft);
    padding:16px;
    text-align:center;
  }

  @media (max-width:760px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    #sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,0.25);}
    #menu-toggle{display:flex !important;}
    .page{padding:70px 20px 60px;}
  }
  #menu-toggle{
    display:none;
    position:fixed;top:14px;left:14px;z-index:21;
    width:38px;height:38px;
    background:var(--green-deep);
    color:var(--paper);
    border:none;border-radius:6px;
    align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
  }


  /* ---------- GEO WORLD V2 knowledge reader ---------- */
  #sidebar{width:390px;min-width:390px;}
  #tree-scroll{scrollbar-gutter:stable;position:relative;padding-bottom:90px;}
  #tree-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px 16px 10px;border-bottom:1px solid var(--line);background:var(--paper-deep);}
  .tree-tool{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;padding:7px 8px;font:500 11.5px 'IBM Plex Sans',sans-serif;cursor:pointer;}
  .tree-tool:hover{border-color:var(--green);color:var(--green-deep);}
  #scroll-progress{height:3px;background:rgba(47,111,94,.12);position:relative;}
  #scroll-progress span{display:block;height:100%;width:0;background:var(--green);transition:width .08s linear;}
  .sections{display:block;padding-left:20px;}
  .part-block.collapsed .sections{display:none;}
  .part-block.collapsed .chev{transform:none;}.part-block:not(.collapsed) .chev{transform:rotate(90deg);}
  .section-row{padding:7px 8px;font-size:12.25px;}
  .term-mini-list{margin:2px 0 8px 24px;border-left:1px dashed rgba(91,106,100,.35);}
  .term-mini{display:block;padding:4px 8px;font-size:11px;color:var(--ink-soft);cursor:pointer;line-height:1.25;border-radius:3px;}
  .term-mini:hover{color:var(--green-deep);background:rgba(47,111,94,.07);}
  .term-mini::before{content:'·';margin-right:6px;color:var(--gold);}
  .reader-intro{font-family:'Fraunces',serif;font-size:20px;line-height:1.55;color:var(--ink);max-width:760px;margin:8px 0 24px;}
  .section-toc{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;}
  .section-toc button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 10px;font-size:11.5px;color:var(--ink-soft);cursor:pointer;}
  .section-toc button:hover{border-color:var(--green);color:var(--green-deep);}
  .visual-panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:20px 0 28px;overflow:hidden;}
  .visual-title{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 4px;color:var(--green-deep);}
  .visual-caption{font-size:12px;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;}
  .visual-panel svg{display:block;width:100%;height:auto;max-height:390px;}
  .knowledge-list{display:grid;gap:14px;}
  .knowledge-card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:18px 20px;scroll-margin-top:18px;}
  .knowledge-card h3{font-family:'Fraunces',serif;margin:0 0 8px;font-size:18px;color:var(--green-deep);}
  .knowledge-card p{font-size:13.5px;line-height:1.66;color:var(--ink);margin:6px 0;}
  .knowledge-card .why{border-top:1px solid rgba(203,193,162,.7);margin-top:10px;padding-top:9px;color:var(--ink-soft);font-size:12.5px;}
  .subgroup-title{font-family:'Fraunces',serif;font-size:21px;color:var(--rust);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .formula{font-family:'IBM Plex Mono',monospace;background:#efe9d7;border-left:3px solid var(--gold);padding:9px 11px;margin-top:9px;font-size:12px;line-height:1.5;}
  .jump-float{position:fixed;right:18px;bottom:18px;z-index:10;display:flex;gap:7px;}
  .jump-float button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--green-deep);box-shadow:0 2px 10px rgba(0,0,0,.08);}
  @media(max-width:760px){#sidebar{width:88vw;min-width:0}.jump-float{right:10px;bottom:10px}.knowledge-card{padding:15px}.reader-intro{font-size:18px}}


/* GEO WORLD V2.1 navigation/scroll repair */
body{overflow:hidden!important;}
#sidebar,.sidebar,.side-panel,.left-panel,.nav-panel{
  overflow-y:auto!important;
  overflow-x:hidden!important;
  height:100vh!important;
  max-height:100vh!important;
  scrollbar-width:auto!important;
  scrollbar-color:#6f7f73 #ddd6c2!important;
}
#sidebar::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.side-panel::-webkit-scrollbar,
.left-panel::-webkit-scrollbar,.nav-panel::-webkit-scrollbar{width:13px!important;}
#sidebar::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track,.side-panel::-webkit-scrollbar-track,
.left-panel::-webkit-scrollbar-track,.nav-panel::-webkit-scrollbar-track{background:#ddd6c2!important;}
#sidebar::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.side-panel::-webkit-scrollbar-thumb,
.left-panel::-webkit-scrollbar-thumb,.nav-panel::-webkit-scrollbar-thumb{
  background:#6f7f73!important;border-radius:8px!important;border:3px solid #ddd6c2!important;
}
main,.main,.content,.main-panel,#content{
  overflow-y:auto!important;
  overflow-x:hidden!important;
  min-height:0!important;
  height:100vh!important;
  max-height:100vh!important;
  scrollbar-width:auto!important;
  scrollbar-color:#6f7f73 #ddd6c2!important;
}
main::-webkit-scrollbar,.main::-webkit-scrollbar,.content::-webkit-scrollbar,
.main-panel::-webkit-scrollbar,#content::-webkit-scrollbar{width:13px!important;}
main::-webkit-scrollbar-track,.main::-webkit-scrollbar-track,.content::-webkit-scrollbar-track,
.main-panel::-webkit-scrollbar-track,#content::-webkit-scrollbar-track{background:#ddd6c2!important;}
main::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,
.main-panel::-webkit-scrollbar-thumb,#content::-webkit-scrollbar-thumb{
  background:#6f7f73!important;border-radius:8px!important;border:3px solid #ddd6c2!important;
}
button{cursor:pointer!important;}

</style>
</head>
<body>

<button id="menu-toggle" aria-label="Toggle menu">☰</button>

<div id="sidebar">
  <div id="masthead">
    <svg class="contours" viewBox="0 0 150 90" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 10 C 100 10, 90 40, 40 40 S 0 70, -20 70" fill="none" stroke="#2F6F5E" stroke-width="1"/>
      <path d="M150 25 C 110 25, 100 50, 55 50 S 10 78, -10 78" fill="none" stroke="#2F6F5E" stroke-width="1"/>
      <path d="M150 40 C 120 40, 112 60, 70 60 S 25 84, 5 84" fill="none" stroke="#2F6F5E" stroke-width="1"/>
    </svg>
    <p class="wordmark">GEO<span>·</span>WORLD</p>
    <p class="tagline">A browsable atlas of the whole discipline of geography — from plate tectonics to GeoAI.</p>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="tree">Knowledge Tree</button>
    <button class="tab-btn" data-tab="countries">Country Explorer</button>
  </div>

  <div id="tab-tree" class="tab-panel">
    <div id="search-wrap"><input id="search" type="text" placeholder="Search every topic and concept…" autocomplete="off"></div>
    <div id="meta-count"></div>
    <div id="scroll-progress"><span></span></div>
    <div id="tree-scroll"></div>
  </div>

  <div id="tab-countries" class="tab-panel" style="display:none;">
    <div id="country-search-wrap"><input id="country-search" type="text" placeholder="Search countries & territories…" autocomplete="off"></div>
    <div id="country-filters">
      <button class="country-filter active" data-filter="all">All 246</button>
      <button class="country-filter" data-filter="Country">Countries 195</button>
      <button class="country-filter" data-filter="Territory">Territories &amp; other 51</button>
    </div>
    <div class="country-list" id="country-list"></div>
  </div>
</div>

<div id="main">
  <div class="page" id="page"></div>
</div>
<div class="jump-float"><button id="page-top" title="Top">↑</button><button id="page-bottom" title="Bottom">↓</button></div>

const TERM_INFO = {"Definition of Geography":"Geography is the systematic study of places, spatial patterns, environments and the relationships linking people and the physical world. It asks where phenomena occur, why they occur there, how places are connected, and how landscapes change through time.","Scope of Geography":"The scope of geography extends from Earth-system processes such as plate tectonics, climate and hydrology to population, cities, economies, cultures, political territories and geospatial technologies. Its distinctive contribution is spatial analysis: explaining variation, distribution, interaction and scale.","Physical Geography":"Physical geography examines natural processes and land-surface systems, including geomorphology, climatology, hydrology, biogeography, soils and oceans. It explains how energy and matter move through the atmosphere, hydrosphere, biosphere and lithosphere.","Human Geography":"Human geography studies the spatial organization of societies: population, migration, settlements, culture, economic activity, politics, development and social relations. It focuses on how human decisions produce places, networks, regions and inequalities.","Location":"Location identifies where something is. Absolute location uses a coordinate or address; relative location describes a place in relation to other places, routes, landmarks or regions.","Place":"Place is a location endowed with physical characteristics, human attributes and meanings. Geographers distinguish its measurable site characteristics from the cultural identities and experiences attached to it.","Region":"A region is an area defined by shared characteristics or functional relationships. Formal regions share measurable traits; functional regions are organized around flows or nodes; perceptual regions exist through shared ideas and identities.","Scale":"Map scale expresses the relationship between a distance on the map and the corresponding distance on the ground. It may be shown as a representative fraction, verbal statement or graphic scale bar.","Earth's formation":"Earth formed about 4.54 billion years ago through accretion of material in the early Solar System. Heating, melting and differentiation separated denser iron-rich material toward the core and lighter silicate material toward the mantle and crust.","Earth's age":"Radiometric dating of meteorites and ancient terrestrial minerals gives an age of about 4.54 billion years for Earth. This age anchors the geological time scale used to reconstruct planetary history.","Earth's shape":"Earth is best approximated by an oblate spheroid, slightly flattened at the poles and wider at the equator because of rotation. For high-precision geodesy, the irregular gravity-defined surface called the geoid is also used.","Rotation":"Earth rotates eastward around its axis once in about 24 hours relative to the Sun. Rotation produces the daily cycle of light and darkness and contributes, through the Coriolis effect, to the deflection of moving air and water.","Revolution":"Earth revolves around the Sun in an elliptical orbit in about 365.242 days. Revolution combined with a 23.44° axial tilt produces the annual cycle of seasons.","Axial tilt":"Earth's rotational axis is tilted about 23.44° from the perpendicular to its orbital plane. This tilt changes solar angle and day length through the year and is the primary cause of seasons.","Latitude":"Latitude is angular distance north or south of the Equator, measured from 0° to 90°. Parallels of latitude are used to locate places and strongly influence solar receipt, climate and day length.","Longitude":"Longitude is angular distance east or west of the Prime Meridian, measured from 0° to 180°. Meridians converge at the poles and provide the basis for global time-zone calculations.","Crust":"The crust is Earth's outermost solid layer. Oceanic crust is generally thinner and denser, dominated by basaltic composition, while continental crust is thicker and less dense with more felsic rocks.","Mantle":"The mantle extends from the base of the crust to roughly 2,900 km depth. It is mostly solid silicate rock, but over geological time it can flow slowly, allowing convection that helps drive plate motion.","Outer core":"The outer core is a liquid iron-nickel layer roughly 2,900–5,150 km below the surface. Convection of electrically conductive metal in this layer is the main source of Earth's magnetic field.","Inner core":"The inner core is the solid central part of Earth, composed mainly of iron and nickel. Extreme pressure keeps it solid despite temperatures comparable to the surface of the Sun.","Plate boundaries":"Plate boundaries are zones where lithospheric plates interact. Divergent boundaries create new crust, convergent boundaries consume or thicken crust, and transform boundaries accommodate horizontal sliding.","Divergent boundaries":"At divergent boundaries plates move apart. Mantle material rises, partially melts and produces new oceanic lithosphere at mid-ocean ridges; continental divergence can form rift valleys.","Convergent boundaries":"At convergent boundaries plates move together. Oceanic lithosphere may subduct beneath another plate, generating trenches, earthquakes and volcanic arcs, while continent-continent collision builds large mountain belts.","Transform boundaries":"Transform boundaries occur where plates slide horizontally past one another. Crust is neither created nor destroyed, but accumulated strain can generate shallow, sometimes damaging earthquakes.","Rock cycle":"The rock cycle describes transformations among igneous, sedimentary and metamorphic rocks through melting, crystallization, weathering, erosion, deposition, burial, heat and pressure.","Weathering":"Weathering is the in-place breakdown or chemical alteration of rock near Earth's surface. Physical weathering fragments material, chemical weathering changes mineral composition, and biological processes can contribute to both.","Erosion":"Erosion is the removal and transport of weathered material by moving water, wind, ice or gravity. It differs from weathering because erosion involves movement.","Deposition":"Deposition occurs when a transporting medium loses energy and lays down sediment. It builds landforms such as floodplains, deltas, beaches, dunes and glacial moraines.","Rivers":"A river is a natural channelized flow of water moving downslope under gravity. River systems collect runoff from drainage basins and transfer water, sediment, nutrients and dissolved materials toward lakes, inland basins or the sea.","Meanders":"Meanders are sinuous river bends produced by lateral erosion on the outer bank and deposition on the inner bank. Continued migration can narrow a meander neck and eventually form an oxbow lake.","Deltas":"A delta forms where a river enters standing water and deposits sediment faster than waves, tides or currents remove it. Delta shape reflects the relative dominance of river flow, waves and tides.","Atmospheric composition":"Dry air near sea level is approximately 78% nitrogen and 21% oxygen, with argon, carbon dioxide and other gases making up most of the remainder. Water vapour is highly variable and is central to weather and the greenhouse effect.","Troposphere":"The troposphere is the lowest atmospheric layer and contains most atmospheric mass and nearly all weather. Temperature generally decreases with altitude within it.","Stratosphere":"The stratosphere lies above the troposphere and contains the ozone layer. Temperature generally increases with height because ozone absorbs ultraviolet radiation.","Atmospheric pressure":"Atmospheric pressure is the force exerted by the weight of air over a unit area. It generally decreases with altitude, and horizontal pressure differences drive wind.","Wind":"Wind is horizontal air movement, principally from areas of higher toward lower pressure, modified by friction and Earth's rotation. Its speed and direction are fundamental elements of weather and climate.","Climate vs weather":"Weather describes short-term atmospheric conditions at a specific time and place; climate describes the statistical characteristics and variability of weather over long periods, commonly using 30-year climatological normals.","Global atmospheric circulation":"Global atmospheric circulation redistributes heat from low to high latitudes through linked Hadley, Ferrel and Polar cells. The system helps generate trade winds, westerlies, subtropical highs and major rainfall belts.","Greenhouse effect":"The greenhouse effect is the warming of Earth's lower atmosphere and surface because gases such as water vapour, carbon dioxide and methane absorb and re-emit outgoing infrared radiation. The natural effect makes Earth habitable; increased greenhouse-gas concentrations strengthen it.","Global warming":"Global warming refers to the long-term rise in Earth's average surface temperature, especially the modern warming driven primarily by human greenhouse-gas emissions. It is one component of broader climate change.","Climate adaptation":"Climate adaptation consists of adjustments that reduce harm or exploit opportunities associated with actual or expected climate impacts, for example flood protection, drought-resilient crops, heat-health planning and ecosystem restoration.","Climate mitigation":"Climate mitigation addresses the causes of climate change by reducing greenhouse-gas emissions or increasing removals from the atmosphere. Examples include renewable energy, energy efficiency, electrification, avoided deforestation and carbon sequestration.","Evaporation":"Evaporation is the phase change of liquid water to water vapour, powered mainly by solar energy. It transfers water from oceans, soils and inland waters to the atmosphere.","Condensation":"Condensation converts water vapour to liquid droplets when air cools to saturation. It is essential to cloud and fog formation and releases latent heat into the atmosphere.","Precipitation":"Precipitation is water falling from the atmosphere to the surface as rain, snow, sleet, hail or related forms. It is a major input to terrestrial water balances.","Infiltration":"Infiltration is the entry of water from the ground surface into soil. Its rate depends on soil texture, structure, moisture, vegetation, land cover and rainfall intensity.","Runoff":"Runoff is water flowing across or through the land toward channels and water bodies when precipitation exceeds infiltration, storage or evapotranspiration. It links rainfall to river discharge and flood generation.","Aquifers":"Aquifers are permeable geological formations that store and transmit usable quantities of groundwater. Unconfined aquifers have a water table; confined aquifers are bounded by lower-permeability layers and may be pressurized.","Ecosystems":"An ecosystem consists of organisms interacting with one another and with the physical environment through flows of energy and cycles of matter. Ecosystems can be described at scales from a pond to a biome.","Food chains":"A food chain is a simplified pathway showing transfer of energy and matter from producers through successive consumers. Real ecosystems are better represented by interconnected food webs.","Biodiversity":"Biodiversity includes genetic diversity, species diversity and ecosystem diversity. It supports ecological functions and human benefits such as food production, pollination, water regulation and cultural values.","Soil formation":"Soil forms through interactions among parent material, climate, organisms, topography and time. Weathering adds mineral material while biological activity contributes organic matter and develops horizons.","Soil profile":"A soil profile is a vertical section through soil showing horizons that differ in colour, texture, structure, organic matter and chemistry. Common master horizons are O, A, E, B, C and underlying R material.","Population density":"Population density expresses the number of people per unit area, commonly persons per square kilometre. Arithmetic density is simple population divided by land area; other measures relate population to arable land or productive capacity.","Population growth":"Population growth is change in population size through births, deaths and migration. At national scale it can be expressed as natural increase plus net migration.","Demographic transition":"The demographic transition model describes a common historical shift from high birth and death rates to low birth and death rates as societies undergo socioeconomic change. It is a model, not a universal law, and countries can follow different pathways.","Urbanization":"Urbanization is the increase in the share of a population living in urban areas, usually accompanied by expansion of towns and cities and changes in economic and social organization.","Urban sprawl":"Urban sprawl is low-density, outward urban expansion that consumes peripheral land and often increases travel distances, infrastructure costs and fragmentation of agricultural or ecological areas.","GDP":"Gross domestic product (GDP) is the monetary value of final goods and services produced within an economy during a specified period. It measures economic output but does not directly measure inequality, environmental quality or overall well-being.","HDI":"The Human Development Index combines indicators of life expectancy, education and income into a composite measure of average human-development achievement. It is useful for broad comparisons but does not capture all dimensions of well-being or inequality.","Food security":"Food security exists when people have reliable physical and economic access to sufficient, safe and nutritious food that meets dietary needs and preferences for an active life. Analysis commonly considers availability, access, utilization and stability.","State":"In political geography, a state is a sovereign political entity with a defined territory, permanent population, government and capacity to conduct external relations. The term differs from nation, which refers primarily to a community of shared identity.","Borders":"Borders are political lines or zones separating territorial jurisdictions. Their location, permeability, enforcement and social meaning influence trade, migration, security and cross-border communities.","Geopolitics":"Geopolitics examines how geographic factors such as location, resources, terrain, sea access, networks and territorial control interact with political power and strategy.","Hazard":"A hazard is a potentially damaging physical event, process or human activity that can cause loss of life, injury, property damage, social disruption or environmental degradation.","Vulnerability":"Vulnerability is the propensity of people, assets or systems to be adversely affected by a hazard. It reflects factors such as exposure, sensitivity, poverty, building quality, preparedness and adaptive capacity.","Risk":"Disaster risk is commonly understood as the potential for loss arising from the interaction of hazard, exposure and vulnerability, moderated by capacity and resilience.","Map elements":"Core map elements normally include a title, mapped body, legend, scale, orientation indicator, coordinate/grid information, data/source notes and suitable labels. The exact set depends on the map's purpose and audience.","Mercator":"The Mercator projection is a cylindrical conformal projection that preserves local angles and shapes, making it historically useful for navigation. Area distortion increases strongly toward the poles.","Cadastral surveying":"Cadastral surveying establishes, re-establishes or documents legal parcel boundaries and associated interests in land. It links field measurement, boundary evidence, legal records and cadastral mapping.","Traverse surveying":"Traverse surveying determines positions by measuring a connected sequence of lines with lengths and directions. Closed traverses permit angular and linear closure checks and adjustment of measurement error.","GNSS/GPS":"GNSS positioning uses signals from satellite constellations to estimate receiver coordinates and time. Survey-grade methods use carrier-phase observations, corrections and careful reference systems to achieve centimetre-level or better precision under suitable conditions.","Datum":"A geodetic datum defines the reference framework used to assign coordinates to locations on or near Earth. Modern datums are tied to reference ellipsoids and Earth-centred reference frames; mixing datums without transformation can shift mapped positions.","Geoid":"The geoid is an equipotential surface of Earth's gravity field that approximately corresponds to mean sea level extended beneath continents. It provides the reference for orthometric heights.","Vector data":"Vector GIS represents discrete geographic features using points, lines and polygons linked to attributes. It is well suited to parcels, roads, boundaries, facilities and other objects with identifiable geometry.","Raster data":"Raster GIS represents space as a regular grid of cells, each storing a value. It is well suited to continuous surfaces and imagery such as elevation, temperature, rainfall and satellite reflectance.","Buffering":"Buffering creates zones at specified distances around points, lines or polygons. It is used in proximity analysis such as identifying land within a road setback or populations within a service radius.","Overlay":"Overlay combines spatial layers so relationships among their geometries and attributes can be analysed. Common operations include intersect, union and identity.","Remote Sensing":"Remote sensing obtains information about objects or surfaces without direct physical contact, typically using sensors aboard satellites, aircraft or drones that measure reflected or emitted electromagnetic energy.","Electromagnetic radiation":"Electromagnetic radiation carries energy as waves characterized by wavelength and frequency. Remote-sensing systems exploit different spectral regions because water, vegetation, soil, minerals and built surfaces interact with radiation differently.","Spectral signatures":"A spectral signature is the pattern of reflectance or emission of a material across wavelengths. Differences in spectral response allow remote-sensing analysts to distinguish vegetation, water, bare soil, minerals and other targets.","GPS":"GPS is the United States' Global Positioning System, one component of the broader GNSS family. It uses a constellation of satellites transmitting precise timing and orbital information to receivers.","RTK":"Real-Time Kinematic positioning uses carrier-phase GNSS observations and corrections from a reference station or network to provide real-time centimetre-level coordinates under favourable conditions.","Photogrammetry":"Photogrammetry derives measurements and 3D information from overlapping photographs. Modern workflows use image matching, camera geometry and control points to generate point clouds, elevation models and orthomosaics.","Digital elevation models":"A digital elevation model is a raster or gridded representation of terrain elevation. DEMs support slope, aspect, watershed, visibility and terrain-volume analysis.","Spatial autocorrelation":"Spatial autocorrelation measures the degree to which nearby observations have similar or dissimilar values. Positive autocorrelation indicates clustering of similar values; negative autocorrelation indicates neighbouring dissimilarity.","Moran's I":"Moran's I is a global statistic for spatial autocorrelation. Its interpretation depends on a spatial-weights matrix and comparison with an expected value under a specified null model.","Geocoding":"Geocoding converts textual location descriptions such as addresses or place names into geographic coordinates or standardized spatial references.","Land tenure":"Land tenure describes the rules, rights, responsibilities and relationships through which people or institutions hold, use, control or transfer land and natural resources.","Parcels":"A land parcel is a spatially defined unit of land associated with interests, rights, restrictions or responsibilities. Cadastral systems represent parcels geometrically and link them to records.","Territorial sea":"Under the modern law of the sea, a coastal state may claim a territorial sea extending up to 12 nautical miles from applicable baselines, within which it exercises sovereignty subject to rules such as innocent passage.","Exclusive Economic Zone":"An Exclusive Economic Zone may extend up to 200 nautical miles from baselines, giving the coastal state sovereign rights over exploration, exploitation, conservation and management of natural resources while preserving specified freedoms for other states.","Research design":"Research design is the coherent plan linking a research problem to questions, concepts, data, sampling, collection methods and analysis. In geography it often integrates spatial scale, temporal scale and location into the design.","Mixed methods":"Mixed-methods research intentionally integrates quantitative and qualitative evidence so that numerical patterns can be interpreted alongside processes, meanings and context.","Bearing":"A bearing expresses the horizontal direction of a line relative to a reference meridian, commonly north. Surveying may use whole-circle bearings/azimuths or quadrant bearings depending on convention.","Azimuth":"An azimuth is a horizontal angle measured clockwise from a reference direction, usually north, from 0° through 360°. It is widely used in surveying, navigation and GIS.","Slope":"Slope expresses the rate of change in elevation with horizontal distance. It may be reported as an angle, ratio or percentage and is fundamental to terrain, engineering, erosion and accessibility analysis.","GeoAI":"GeoAI combines geospatial data and spatial reasoning with artificial intelligence methods such as machine learning, deep learning and computer vision. Applications include feature extraction, land-cover classification, forecasting, routing and spatial decision support.","Digital twins":"A geospatial digital twin is a dynamic digital representation of a physical place or system that links 3D geometry, sensor observations, models and operational data to support monitoring, simulation and planning.","Nature of Geography":"Geography is both a natural science and a social science: it uses systematic, empirical methods to study physical processes while also interpreting how people perceive, use and transform space, giving it a dual, integrative character shared by few other disciplines.","Branches of Geography":"The discipline is conventionally divided into physical geography (natural systems), human geography (societies and economies), and technical/methodological branches such as cartography, GIS and remote sensing that supply tools for both.","Regional Geography":"Regional geography synthesises physical and human elements to characterise a specific area as a coherent whole, comparing its internal unity with the distinctiveness that sets it apart from neighbouring regions.","Environmental Geography":"Environmental geography sits at the interface of physical and human geography, examining how natural systems shape human activity and how human activity in turn alters environmental processes and resources.","Technical Geography":"Technical geography covers the quantitative and instrumental tools of the discipline — cartography, geodesy, GIS, remote sensing and spatial statistics — that are used to acquire, store, analyse and present spatial data.","Applied Geography":"Applied geography uses geographic theory, data and methods to address practical problems such as land-use planning, hazard mitigation, resource management and public policy.","Integrated Geography":"Integrated geography deliberately combines physical and human perspectives to study coupled human–environment systems, such as land-use change, climate impacts or water resource conflicts, that cannot be understood from either perspective alone.","Geography and spatial science":"Spatial science is the broader family of quantitative disciplines — geography, GIS science, spatial statistics, spatial economics — that share a formal concern with location, distance, pattern and spatial relationships.","Geography as a social science":"As a social science, geography investigates how human decisions, institutions, culture and economies produce uneven spatial patterns of settlement, activity, inequality and development.","Geography as a natural science":"As a natural science, geography applies physical laws and empirical observation to explain landforms, climate, ecosystems and other Earth-surface processes.","Geography as an Earth science":"As an Earth science, geography shares subject matter with geology, meteorology and oceanography, but distinguishes itself by its explicit focus on spatial pattern, place and the human–environment interface.","Ancient Geography":"Ancient geography refers to the earliest recorded geographic thought, including Babylonian and Egyptian mapping and early attempts by Greek and other scholars to describe and measure the known world.","Greek Geography":"Greek geography, developed by figures such as Eratosthenes (who estimated Earth's circumference) and Ptolemy (who compiled a coordinate-based world atlas), established foundational concepts of a spherical Earth, latitude, longitude and map projection.","Roman Geography":"Roman geography emphasised practical, administrative and military mapping of an expanding empire, producing itineraries, road maps and regional descriptions such as those of Strabo and Pliny the Elder.","Islamic Geography":"Between the 8th and 14th centuries, Islamic scholars such as al-Idrisi and Ibn Battuta preserved and extended Greek geographic knowledge, refined mapmaking and coordinate tables, and produced extensive travel and regional geographies.","Medieval Geography":"Medieval European geography combined classical inheritance with religious cosmology, producing schematic mappae mundi alongside more practical portolan sailing charts used by Mediterranean navigators.","European exploration":"From the 15th century, European maritime exploration systematically charted coastlines and ocean routes worldwide, generating new empirical geographic knowledge alongside colonial expansion.","Age of Discovery":"The Age of Discovery (roughly 15th–17th centuries) was the period of European transoceanic voyages that greatly expanded global geographic knowledge, cartography and, with it, colonial trade networks.","Colonial Geography":"Colonial geography describes the geographic knowledge, mapping and territorial administration produced by colonial powers, often organised around resource extraction and political control rather than local knowledge systems.","Classical Geography":"Classical geography refers broadly to descriptive, regional geography as practised from antiquity through the early twentieth century, before the discipline's quantitative and theoretical turn.","Quantitative Revolution":"The Quantitative Revolution of the 1950s–60s shifted geography toward statistical analysis, mathematical modelling and spatial theory, moving the discipline away from purely descriptive regional accounts.","Behavioural Geography":"Behavioural geography studies how individual perception, cognition and decision-making shape spatial behaviour, such as choice of residence, travel routes or mental maps, rather than assuming purely rational spatial optimisation.","Humanistic Geography":"Humanistic geography, emerging in the 1970s, emphasises subjective human experience, meaning and a sense of place, drawing on phenomenology to counter the abstraction of quantitative spatial science.","Radical Geography":"Radical geography applies Marxist and other critical political-economic theory to explain spatial inequality, uneven development and the production of space under capitalism.","Feminist Geography":"Feminist geography examines how gender shapes and is shaped by spatial arrangements, access to resources, mobility and the experience of place, and critiques gender bias in geographic knowledge production.","Critical Geography":"Critical geography encompasses radical, feminist, postcolonial and other perspectives that interrogate power relations embedded in spatial organisation, geographic knowledge and mapping practices.","Contemporary Geography":"Contemporary geography integrates quantitative, critical and technological approaches, increasingly organised around big data, GeoAI, sustainability and global environmental change.","Geospatial Revolution":"The Geospatial Revolution refers to the rapid expansion since the 1990s of satellite positioning, remote sensing, GIS and web mapping, which transformed how spatial data is collected, analysed and shared.","Space":"In geography, space is the abstract, undifferentiated extent within which locations, distances and spatial relationships exist, distinguished from 'place', which is space invested with meaning and character.","Distance":"Distance is the measured separation between two locations, expressed as physical (metric) distance, time distance, cost distance or perceived (cognitive) distance, each shaping interaction differently.","Direction":"Direction describes the orientation of one location relative to another, typically expressed as a compass bearing or cardinal direction, and is a basic component of navigation and spatial description.","Distribution":"Distribution describes the arrangement of a phenomenon across space — where it occurs, in what quantity, and how densely or sparsely — and is a starting point for most geographic analysis.","Pattern":"A spatial pattern is the geometric arrangement of a distribution, described as clustered, dispersed, random or regular, and analysed to infer the underlying processes that produced it.","Interaction":"Spatial interaction is the flow of people, goods, information or ideas between places, driven by complementarity, intervening opportunity and distance, and is fundamental to models such as the gravity model.","Movement":"Movement is the physical relocation of people, goods or information across space over time, ranging from daily commuting to long-distance migration and global trade flows.","Accessibility":"Accessibility is the ease with which a location, service or opportunity can be reached from a given point, influenced by distance, transport infrastructure, cost and time.","Connectivity":"Connectivity describes the degree and directness of linkage between places within a network, such as road, rail or communication systems, and affects the efficiency of movement and interaction.","Landscape":"A landscape is the visible, tangible assemblage of physical and human features across an area, shaped jointly by natural processes and human modification, and studied both scientifically and as cultural expression.","Territory":"Territory is a bounded area over which an individual, group or state claims and exercises control, combining physical space with political, legal or social authority.","Environment":"In geography, environment refers to the surrounding physical, biological and, in broader usage, social conditions that influence and are influenced by human activity.","Spatial association":"Spatial association is the degree to which two or more phenomena co-occur or covary across the same locations, used to infer possible relationships between distributions.","Spatial diffusion":"Spatial diffusion is the process by which a phenomenon, innovation or disease spreads outward from an origin over time, commonly classified as expansion diffusion or relocation diffusion.","Human–environment interaction":"Human–environment interaction is the reciprocal relationship in which people adapt to, modify and depend on their physical surroundings, forming one of geography's core organising themes.","Universe":"The universe is the entirety of space, time, matter and energy, containing all galaxies, stars, planets and other astronomical objects, and is the outermost context within which Earth's geography is set.","Galaxies":"Galaxies are vast gravitationally bound systems of stars, stellar remnants, gas, dust and dark matter; Earth's Solar System lies within the Milky Way galaxy.","Solar System":"The Solar System comprises the Sun and the bodies gravitationally bound to it, including eight planets, dwarf planets, moons, asteroids and comets, of which Earth is the third planet from the Sun.","Sun":"The Sun is the star at the centre of the Solar System, a sphere of hot plasma whose radiated energy drives Earth's climate, weather, ocean circulation and photosynthesis-based life.","Planets":"Planets are large, roughly spherical bodies that orbit a star, have cleared their orbital neighbourhood of other debris, and, in the Solar System, are divided into rocky inner planets and gas/ice giant outer planets.","Moons":"Moons are natural satellites that orbit planets; Earth's single Moon influences tides, stabilises axial tilt and has historically guided calendars and navigation.","Asteroids":"Asteroids are small, mostly rocky bodies orbiting the Sun, concentrated in the asteroid belt between Mars and Jupiter, that occasionally cross Earth's orbit and pose impact hazards.","Comets":"Comets are small icy bodies that develop glowing comas and tails of gas and dust as they approach the Sun, originating from the outer Solar System's Kuiper Belt or Oort Cloud.","Meteoroids":"Meteoroids are small fragments of rock or metal travelling through space that, upon entering Earth's atmosphere, burn up as meteors or, if they survive to reach the ground, become meteorites.","Earth's size":"Earth has an equatorial radius of about 6,378 km and a polar radius of about 6,357 km, reflecting its slightly oblate shape, with a circumference of roughly 40,075 km at the Equator.","Earth's mass":"Earth has a mass of approximately 5.97 × 10^24 kg, generating the surface gravity that holds the atmosphere, oceans and living organisms in place.","Earth's movements":"Earth undergoes several simultaneous motions, principally daily rotation on its axis and annual revolution around the Sun, alongside slower phenomena such as axial precession, that together govern day length, seasons and long-term climate cycles.","Earth–Sun relationship":"The changing geometric relationship between Earth and the Sun — driven by rotation, revolution and axial tilt — controls the distribution of solar energy across latitudes and seasons, underpinning global climate patterns.","Earth's axis":"Earth's axis is the imaginary line through the North and South Poles about which the planet rotates, tilted approximately 23.44° from perpendicular to the plane of its orbit.","Day and night":"Day and night result from Earth's rotation, which continuously brings different halves of the planet into and out of direct sunlight roughly every 24 hours.","Seasons":"Seasons are periodic changes in temperature and daylight caused by Earth's axial tilt as it revolves around the Sun, altering the angle and duration of solar radiation received at a given latitude through the year.","Solstices":"Solstices occur around 21 June and 21 December, marking the points in Earth's orbit when a hemisphere is tilted most directly toward or away from the Sun, producing the longest and shortest days of the year.","Equinoxes":"Equinoxes occur around 20 March and 22 September, when Earth's axis is tilted neither toward nor away from the Sun, giving roughly equal day and night length worldwide.","Polar day":"Polar day, or midnight sun, occurs within the Arctic and Antarctic Circles when the Sun remains continuously above the horizon for 24 hours or more around the local summer solstice.","Polar night":"Polar night occurs within the Arctic and Antarctic Circles when the Sun remains continuously below the horizon for 24 hours or more around the local winter solstice.","Time zones":"Time zones are longitudinal bands, nominally 15° wide, within which a common standard time is used, established relative to Coordinated Universal Time to approximate local solar time.","International Date Line":"The International Date Line is an irregular line roughly following the 180° meridian across the Pacific Ocean, where the calendar date changes by one day when crossed.","Apparent movement of the Sun":"The apparent movement of the Sun — its daily path across the sky and its annual shift between the Tropics of Cancer and Capricorn — results from Earth's rotation and axial tilt, not actual solar motion.","Length of day":"Length of day is the duration between sunrise and sunset, which varies with latitude and season due to Earth's axial tilt, reaching extremes of continuous daylight or darkness within the polar circles.","Equator":"The Equator is the great circle at 0° latitude, equidistant from both poles, dividing Earth into Northern and Southern Hemispheres and marking the line of maximum solar exposure at the equinoxes.","Prime Meridian":"The Prime Meridian is the reference line of 0° longitude, passing through Greenwich, England by international agreement, from which longitude is measured east and west and from which Coordinated Universal Time is calculated.","Parallels":"Parallels are imaginary lines of constant latitude that circle the globe parallel to the Equator, used with meridians to form the geographic coordinate grid.","Meridians":"Meridians are imaginary north–south lines of constant longitude running from pole to pole, converging at the poles and used with parallels to fix location.","Tropic of Cancer":"The Tropic of Cancer, at approximately 23.44°N, marks the northernmost latitude where the Sun can appear directly overhead, occurring at the June solstice.","Tropic of Capricorn":"The Tropic of Capricorn, at approximately 23.44°S, marks the southernmost latitude where the Sun can appear directly overhead, occurring at the December solstice.","Arctic Circle":"The Arctic Circle, at approximately 66.56°N, marks the southern boundary of the region that experiences at least one day of continuous sunlight in summer and continuous darkness in winter.","Antarctic Circle":"The Antarctic Circle, at approximately 66.56°S, marks the northern boundary of the region that experiences at least one day of continuous sunlight in summer and continuous darkness in winter.","Hemispheres":"Hemispheres are the four halves into which Earth is conventionally divided by the Equator (Northern/Southern) and the Prime Meridian and 180° meridian (Eastern/Western).","Coordinates":"Geographic coordinates are pairs of latitude and longitude values that specify a unique location on Earth's surface relative to the Equator and the Prime Meridian.","Geographic position":"Geographic position is the location of a place expressed either absolutely, by coordinates, or relatively, by its relationship to other known places.","Absolute location":"Absolute location is the fixed, precise position of a place, typically expressed as a pair of latitude and longitude coordinates or a street address.","Relative location":"Relative location describes where a place is in relation to other places, such as its distance, direction or accessibility from a landmark, city or region.","Lithosphere":"The lithosphere is Earth's rigid outer shell, comprising the crust and the uppermost solid mantle, broken into tectonic plates that move over the underlying, more ductile asthenosphere.","Asthenosphere":"The asthenosphere is a weak, ductile layer of the upper mantle beneath the lithosphere that can flow slowly over geological time, allowing tectonic plates to move across it.","Mesosphere":"In Earth-structure terms, the mesosphere is the strong lower part of the mantle beneath the asthenosphere; the same name is also used, in atmospheric science, for the atmospheric layer above the stratosphere where temperature decreases with altitude.","Earth's internal heat":"Earth's internal heat originates from residual heat of planetary formation and ongoing radioactive decay of elements such as uranium and thorium, driving mantle convection, plate tectonics and volcanism.","Geothermal energy":"Geothermal energy is heat originating from Earth's interior that can be captured at the surface, particularly near tectonically active zones, and used directly or converted to electricity.","Continental plates":"Continental plates are tectonic plates capped by thick, buoyant continental crust, which resists subduction and instead thickens and deforms when it collides with other plates.","Oceanic plates":"Oceanic plates are tectonic plates capped by thin, dense basaltic oceanic crust, formed at mid-ocean ridges and eventually subducted back into the mantle at convergent boundaries.","Subduction":"Subduction is the process by which a denser tectonic plate, usually oceanic, descends beneath a less dense plate at a convergent boundary, generating deep trenches, earthquakes and volcanic arcs.","Seafloor spreading":"Seafloor spreading is the creation of new oceanic crust at mid-ocean ridges as magma rises to fill the gap left by plates moving apart, progressively widening ocean basins.","Continental drift":"Continental drift is the hypothesis, proposed by Alfred Wegener in 1912, that continents have moved across Earth's surface over geological time; it was later confirmed and mechanistically explained by plate tectonics.","Pangaea":"Pangaea was a supercontinent that existed from roughly 335 to 175 million years ago, uniting nearly all of Earth's landmasses before it began breaking apart into the present continents.","Supercontinents":"Supercontinents are landmasses formed when most or all continental crust assembles into a single mass, as has happened repeatedly over Earth's history through the tectonic supercontinent cycle.","Plate movement":"Plate movement is the slow horizontal displacement of tectonic plates, typically a few centimetres per year, driven mainly by mantle convection, slab pull at subduction zones and ridge push at spreading centres.","Minerals":"Minerals are naturally occurring, inorganic solids with a definite chemical composition and ordered crystal structure, and are the basic building blocks of rocks.","Rocks":"Rocks are naturally occurring solid aggregates of one or more minerals (or mineraloids), classified by origin into igneous, sedimentary and metamorphic types.","Igneous rocks":"Igneous rocks form from the cooling and crystallisation of molten magma or lava, either slowly underground (intrusive, e.g. granite) or rapidly at the surface (extrusive, e.g. basalt).","Sedimentary rocks":"Sedimentary rocks form from the compaction and cementation of accumulated sediment, or from chemical precipitation, and often preserve fossils and layered bedding that record past environments.","Metamorphic rocks":"Metamorphic rocks form when existing rocks are transformed by heat, pressure or chemically active fluids without fully melting, producing new textures and minerals, as in the transformation of limestone to marble.","Geological time":"Geological time is the immense timescale of Earth's history, roughly 4.54 billion years, organised into eons, eras, periods and epochs based on rock strata and fossil evidence.","Fossils":"Fossils are the preserved remains or traces of ancient organisms, providing key evidence for reconstructing past life, environments and geological time.","Stratigraphy":"Stratigraphy is the study of rock layers (strata) and their sequence, used to interpret the relative timing of geological events and past environmental conditions.","Structural geology":"Structural geology studies the deformation of rocks — folding, faulting and fracturing — and the stresses and processes that produced these structures.","Economic geology":"Economic geology studies the formation, distribution and extraction of economically valuable geological materials such as ores, fuels and industrial minerals.","Petroleum geology":"Petroleum geology studies the formation, migration, accumulation and exploration of oil and natural gas within sedimentary basins.","Engineering geology":"Engineering geology applies geological knowledge to civil-engineering problems such as foundation design, slope stability and site assessment for construction.","Uplift":"Uplift is the vertical rise of Earth's crust, driven by tectonic forces such as plate collision, isostatic rebound or mantle upwelling, that builds mountains and plateaus over time.","Subsidence":"Subsidence is the gradual sinking or settling of Earth's surface, caused by tectonic processes, sediment compaction, or human activities such as groundwater or hydrocarbon extraction.","Folding":"Folding is the bending of rock layers in response to compressive stress, producing wave-like structures such as anticlines and synclines, commonly seen in mountain belts.","Faulting":"Faulting is the fracturing of rock along which measurable displacement occurs, classified as normal, reverse or strike-slip depending on the direction of movement, and is a principal source of earthquakes.","Volcanism":"Volcanism encompasses the processes by which magma, gases and volcanic material reach Earth's surface, producing landforms such as volcanoes, lava flows and calderas.","Magmatism":"Magmatism refers to the generation, movement and solidification of magma within Earth's crust and mantle, underlying both volcanic eruptions and the formation of intrusive igneous rock bodies.","Metamorphism":"Metamorphism is the solid-state transformation of rock texture and mineralogy under heat, pressure or chemically active fluids, without complete melting.","Denudation":"Denudation is the combined long-term wearing down of Earth's surface through weathering, erosion and mass movement, gradually lowering landscapes over geological time.","Fold mountains":"Fold mountains form where compressive tectonic forces buckle rock layers into folds, typically at convergent plate boundaries; the Himalayas and Alps are classic examples.","Block mountains":"Block mountains, or fault-block mountains, form when tensional forces fracture crust into blocks that are uplifted or tilted along faults, as in the Sierra Nevada of the United States.","Volcanic mountains":"Volcanic mountains are built up by accumulated lava, ash and other erupted material around a vent, ranging from steep composite cones to broad shield volcanoes.","Dome mountains":"Dome mountains form when upwelling magma pushes overlying rock layers upward into a broad, dome-shaped bulge without breaking through to erupt at the surface.","Mountain ranges":"A mountain range is a series of connected peaks and ridges sharing a common geological origin, typically formed along tectonic plate boundaries.","Valleys":"Valleys are elongated depressions in the land surface, most commonly carved by river erosion (V-shaped) or glacial erosion (U-shaped), running between higher ground.","Passes":"A mountain pass is a lower, navigable gap through a mountain range or ridge, historically important for trade routes, migration and military movement.","Volcanic plateaus":"Volcanic plateaus are broad, elevated flatlands built up by repeated, extensive lava flows, such as the Columbia Plateau or the Deccan Plateau.","Dissected plateaus":"Dissected plateaus are elevated flatlands that have been deeply cut by river erosion into a rugged network of valleys and remnant flat-topped surfaces.","Intermontane plateaus":"Intermontane plateaus are elevated flatlands enclosed by surrounding mountain ranges, such as the Tibetan Plateau or the Colorado Plateau.","Coastal plains":"Coastal plains are low-lying, gently sloping areas of land adjacent to a coastline, typically formed by sediment deposition or the emergence of former continental-shelf seabed.","Alluvial plains":"Alluvial plains are flat lowlands built up by sediment deposited by rivers over time, often highly fertile and intensively farmed.","Floodplains":"A floodplain is the relatively flat land bordering a river that is periodically inundated during high flow, built up by sediment deposited when the river overtops its banks.","Structural plains":"Structural plains are extensive flat or gently tilted lowlands underlain by horizontal or near-horizontal sedimentary rock layers with little tectonic disturbance.","Hills":"Hills are elevated landforms with a rounded summit and moderate relief, smaller and generally less rugged than mountains.","Basins":"A geomorphic basin is a low-lying area, often bowl-shaped and enclosed by higher ground, into which surface water and sediment tend to drain and accumulate.","Canyons":"Canyons are deep, narrow valleys with steep sides, typically carved by rivers cutting through resistant rock over long periods, as in the Grand Canyon.","Gorges":"A gorge is a narrow, steep-sided valley, similar to a canyon but often shorter and formed where a river cuts rapidly through resistant rock.","Escarpments":"An escarpment is a steep slope or long cliff separating two relatively level land surfaces at different elevations, often produced by faulting or differential erosion.","Cliffs":"A cliff is a very steep or vertical rock face, formed by erosion, faulting or mass wasting, common along coasts, river gorges and mountain fronts.","Caves":"Caves are natural underground cavities large enough for human entry, formed by processes such as chemical dissolution of limestone, wave action, lava-tube formation or glacial melt.","Karst landscapes":"Karst landscapes develop where soluble bedrock, typically limestone, is dissolved by acidic water, producing sinkholes, caves, underground drainage and distinctive surface features.","River basins":"A river basin, or drainage basin, is the total land area from which surface water drains into a particular river system and its tributaries.","Drainage systems":"A drainage system is the network of a river and its tributaries through which water and sediment are collected and transported from a drainage basin.","Drainage patterns":"Drainage patterns describe the geometric arrangement of a river network in plan view — such as dendritic, trellis, radial or rectangular — which reflects underlying geology, slope and rock structure.","Watersheds":"A watershed is the boundary line, typically a ridge of high ground, that separates one drainage basin from an adjacent one.","River source":"A river source is the point of origin of a river, such as a spring, melting glacier, lake or area of concentrated surface runoff.","River mouth":"A river mouth is the point where a river discharges into a larger body of water, such as the sea, a lake or another river, often forming a delta or estuary.","Tributaries":"Tributaries are smaller streams or rivers that flow into and contribute their discharge to a larger river.","Oxbow lakes":"An oxbow lake is a curved, isolated body of water formed when a meander loop is cut off from the main river channel as the river straightens its course.","Waterfalls":"Waterfalls occur where a river drops abruptly over a vertical or steep change in elevation, typically caused by differences in rock resistance or tectonic and glacial effects on the channel.","Levees":"Levees are raised banks along a river channel, formed naturally by sediment deposited during floods or built artificially to contain floodwaters.","River terraces":"River terraces are stepped, flat surfaces flanking a valley that represent former floodplain levels abandoned as the river cut down to a lower elevation.","Flooding":"Flooding occurs when water overflows the normal confines of a river, lake or coastline, or accumulates on land, typically due to intense rainfall, snowmelt, storm surge or inadequate drainage.","River erosion":"River erosion is the wearing away and removal of bed and bank material by flowing water, through processes such as hydraulic action, abrasion, attrition and corrosion.","River deposition":"River deposition is the laying down of sediment by a river when its velocity and energy decrease, building features such as floodplains, deltas, levees and point bars.","Waves":"Ocean waves are oscillations of water surface generated mainly by wind transferring energy to the sea, and are a primary driver of coastal erosion and deposition.","Tides":"Tides are the periodic rise and fall of sea level caused by the gravitational pull of the Moon and Sun combined with Earth's rotation.","Currents":"Ocean currents are large-scale, persistent movements of seawater driven by wind, density differences and Earth's rotation, redistributing heat and influencing climate and coastlines.","Coastal erosion":"Coastal erosion is the wearing away of coastal land by wave action, currents and weathering, producing landforms such as cliffs, wave-cut platforms, arches and stacks.","Coastal deposition":"Coastal deposition is the accumulation of sediment along a coastline by waves and currents, building landforms such as beaches, spits, bars and lagoons.","Beaches":"Beaches are accumulations of sand, gravel or shingle deposited along a shoreline by wave action, constantly reshaped by changing wave energy and sediment supply.","Arches":"A coastal arch forms when wave erosion breaches a headland, cutting a passage through rock and leaving a bridge-like remnant above.","Stacks":"A sea stack is an isolated pillar of rock left standing offshore after the collapse of a coastal arch or the erosion of a headland.","Spits":"A spit is a narrow accumulation of sand or shingle extending from the coast into open water, formed by longshore drift depositing sediment where the coastline changes direction.","Bars":"A coastal bar is a ridge of sand or shingle deposited across a bay or estuary mouth by longshore drift, sometimes fully enclosing a lagoon.","Lagoons":"A lagoon is a shallow body of water separated from the open sea by a barrier such as a sandbar, spit or coral reef.","Estuaries":"An estuary is a partially enclosed coastal water body where freshwater from rivers mixes with saline seawater, forming a productive and dynamic ecological transition zone.","Coral reefs":"Coral reefs are calcium-carbonate structures built by colonies of coral polyps in warm, shallow, clear tropical waters, supporting exceptionally high marine biodiversity.","Mangroves":"Mangroves are salt-tolerant trees and shrubs forming coastal wetland forests in tropical and subtropical intertidal zones, stabilising sediment and buffering coasts from storms.","Glaciers":"Glaciers are large, persistent masses of compacted ice that form on land from accumulated snow and flow slowly under gravity, eroding and depositing material as they move.","Ice sheets":"Ice sheets are continental-scale masses of glacial ice, such as those covering Antarctica and Greenland, thick enough to bury underlying terrain and flow outward toward their margins.","Ice caps":"Ice caps are dome-shaped masses of glacial ice smaller than ice sheets, typically covering highland areas and burying the underlying topography.","Glacial erosion":"Glacial erosion is the wearing away of bedrock and sediment by moving glacial ice through plucking and abrasion, carving landforms such as U-shaped valleys and cirques.","Glacial deposition":"Glacial deposition is the laying down of sediment (till and outwash) carried by glacial ice as it melts or slows, forming landforms such as moraines, drumlins and eskers.","Moraines":"Moraines are ridges or mounds of unsorted rock debris deposited directly by glacial ice at its margins, base or terminus.","U-shaped valleys":"U-shaped valleys are broad, steep-sided valleys with flat floors carved by glacial erosion, distinct from the narrower V-shaped valleys cut by rivers.","Fjords":"Fjords are long, narrow, steep-sided coastal inlets formed by glacial erosion of a valley that was subsequently flooded by rising sea level.","Cirques":"A cirque is a bowl-shaped hollow with steep walls, carved at the head of a glacial valley by rotational erosion of accumulating ice.","Arêtes":"An arête is a narrow, jagged ridge formed when two adjacent cirques erode toward each other from opposite sides of a mountain.","Drumlins":"Drumlins are elongated, streamlined hills of glacial till, shaped by the movement of overriding ice and typically found in swarms indicating former ice-flow direction.","Eskers":"Eskers are long, winding ridges of sand and gravel deposited by meltwater streams flowing within or beneath a glacier or ice sheet.","Permafrost":"Permafrost is ground, including rock or soil, that remains at or below 0°C for at least two consecutive years, common in polar and high-altitude regions.","Glacial landscapes":"Glacial landscapes are terrains whose landforms — valleys, moraines, drumlins, fjords and cirques — were primarily shaped by past or present glacial erosion and deposition.","Deserts":"Deserts are regions receiving very low precipitation, typically less than about 250 mm annually, resulting in sparse vegetation and distinctive landforms shaped largely by wind and occasional intense rainfall.","Sand dunes":"Sand dunes are mounds or ridges of windblown sand, whose shape (such as barchan, transverse or star dunes) reflects wind direction, sand supply and vegetation cover.","Ergs":"Ergs are extensive desert regions covered by large seas of wind-deposited sand dunes.","Regs":"Regs are desert surfaces of coarse gravel and pebbles from which finer sand and dust have been removed by wind deflation.","Hamadas":"Hamadas are barren, rocky desert plateaus with a thin or absent sediment cover, exposed to intense wind erosion.","Yardangs":"Yardangs are streamlined ridges of rock or sediment sculpted by sustained wind erosion (abrasion and deflation) aligned parallel to the prevailing wind.","Oases":"An oasis is an isolated fertile area within a desert where groundwater reaches or nears the surface, supporting vegetation and human settlement.","Desert pavements":"Desert pavements are surfaces covered by a tightly packed layer of gravel and stones left behind after wind and water have removed finer sediment.","Wind erosion":"Wind erosion is the removal of loose sediment by wind through deflation (lifting fine particles) and abrasion (sandblasting exposed surfaces).","Aeolian deposition":"Aeolian deposition is the accumulation of windblown sediment, forming features such as sand dunes and loess plains.","Atmospheric structure":"Earth's atmosphere is vertically layered by temperature profile into the troposphere, stratosphere, mesosphere, thermosphere and exosphere, each with distinct characteristics and roles.","Thermosphere":"The thermosphere is the atmospheric layer above the mesosphere in which temperature rises sharply with altitude due to absorption of high-energy solar radiation, and where auroras and low-orbit satellites occur.","Exosphere":"The exosphere is the outermost atmospheric layer, where the air is extremely thin and gradually merges into the vacuum of space, with particles occasionally escaping Earth's gravity.","Temperature":"Temperature is a measure of the average kinetic energy of molecules in the air, land or water, and is a fundamental variable controlling weather, climate and ecosystem processes.","Humidity":"Humidity is the amount of water vapour present in the air, expressed as absolute humidity (mass per volume) or relative humidity (percentage of the maximum the air can hold at a given temperature).","Air temperature":"Air temperature is the temperature of the atmosphere measured at a standard height above the ground, a key variable in weather observation and climate classification.","Clouds":"Clouds are visible masses of condensed water droplets or ice crystals suspended in the atmosphere, classified by altitude and form, and central to precipitation processes.","Rainfall":"Rainfall is liquid precipitation reaching the surface as drops of water, produced when cloud droplets grow large enough to fall under gravity.","Snow":"Snow is precipitation of ice crystals that form in cold clouds and fall to the surface when the air column remains below freezing.","Hail":"Hail is precipitation of layered ice pellets formed when strong updrafts in cumulonimbus clouds repeatedly carry droplets through freezing layers before they fall.","Fog":"Fog is a cloud of tiny water droplets suspended near ground level, reducing visibility, formed when air near the surface cools to its dew point or becomes saturated by evaporation.","Dew":"Dew is liquid water that condenses on cool surfaces near the ground overnight when air temperature falls to the dew point.","Frost":"Frost is a deposit of ice crystals that forms on surfaces when water vapour undergoes deposition directly from gas to solid at temperatures below freezing.","Thunderstorms":"Thunderstorms are convective storms generated by strong updrafts in cumulonimbus clouds, producing lightning, thunder, heavy rain, and sometimes hail or tornadoes.","Lightning":"Lightning is a sudden electrical discharge within a thunderstorm, or between a storm cloud and the ground, caused by the build-up of electrical charge through collisions of ice and water particles.","Tornadoes":"Tornadoes are violently rotating columns of air extending from a thunderstorm to the ground, capable of extreme, highly localised wind damage.","Tropical cyclones":"Tropical cyclones are intense rotating storm systems that form over warm tropical oceans, drawing energy from latent heat release, and are known regionally as hurricanes or typhoons.","Climate classification":"Climate classification systems, such as the widely used Köppen–Geiger system, group regions into climate types based on characteristic temperature and precipitation patterns.","Climate zones":"Climate zones are latitudinal or regional bands with broadly similar climate characteristics, such as tropical, arid, temperate, continental and polar zones.","Tropical climate":"Tropical climates occur in low latitudes and are characterised b
