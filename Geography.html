y consistently high temperatures year-round, with variation mainly in rainfall between wet and dry seasons.","Dry climate":"Dry climates are characterised by potential evaporation exceeding precipitation, producing arid deserts and semi-arid steppe conditions with sparse and unreliable rainfall.","Temperate climate":"Temperate climates occur in the mid-latitudes and feature moderate seasonal variation in temperature, without the extremes of tropical heat or polar cold.","Continental climate":"Continental climates, found in the interiors of large landmasses, feature large seasonal temperature ranges, cold winters and warm summers, due to distance from moderating oceanic influence.","Polar climate":"Polar climates occur at high latitudes and are characterised by very low temperatures year-round, with the warmest month rarely exceeding 10°C.","Highland climate":"Highland climates are found at high elevations and are characterised by temperatures that decrease with altitude, often producing climate zones markedly cooler than the surrounding lowlands at the same latitude.","Hadley cells":"Hadley cells are large atmospheric circulation loops in which air rises near the Equator, moves poleward at altitude, sinks around 30° latitude, and returns equatorward as the trade winds.","Ferrel cells":"Ferrel cells are mid-latitude atmospheric circulation cells, driven indirectly by the Hadley and Polar cells, in which surface air generally moves poleward, associated with the prevailing westerly winds.","Polar cells":"Polar cells are atmospheric circulation loops in which cold air sinks near the poles, flows equatorward at the surface as the polar easterlies, and rises again around 60° latitude.","Trade winds":"Trade winds are persistent easterly surface winds blowing from the subtropical high-pressure belts toward the Equator, forming the surface branch of the Hadley cells.","Westerlies":"Westerlies are prevailing surface winds blowing from the west in the mid-latitudes of both hemispheres, associated with the Ferrel cell and the passage of mid-latitude weather systems.","Polar easterlies":"Polar easterlies are cold surface winds blowing from the east near the poles, forming the surface branch of the Polar cells.","Jet streams":"Jet streams are narrow bands of very strong, fast-flowing air in the upper troposphere, formed by strong temperature contrasts between air masses, that steer surface weather systems.","Monsoons":"Monsoons are seasonal reversals of wind direction, most pronounced in South and Southeast Asia, driven by differential heating of land and ocean, bringing pronounced wet and dry seasons.","El Niño":"El Niño is the warm phase of the El Niño–Southern Oscillation, characterised by above-average sea-surface temperatures in the central and eastern tropical Pacific, disrupting global weather patterns.","La Niña":"La Niña is the cool phase of the El Niño–Southern Oscillation, characterised by below-average sea-surface temperatures in the central and eastern tropical Pacific, with impacts often opposite to El Niño's.","ENSO":"ENSO, the El Niño–Southern Oscillation, is a recurring irregular cycle of coupled ocean–atmosphere variability in the tropical Pacific that alternates between El Niño, La Niña and neutral phases, influencing weather worldwide.","Ocean–atmosphere interaction":"Ocean–atmosphere interaction refers to the exchange of heat, moisture and momentum between the ocean and the atmosphere, which drives phenomena such as monsoons, cyclones and ENSO.","Greenhouse gases":"Greenhouse gases, including carbon dioxide, methane, nitrous oxide and water vapour, absorb and re-emit infrared radiation, warming the lower atmosphere through the greenhouse effect.","Climate variability":"Climate variability refers to fluctuations in climate conditions around long-term averages, occurring on timescales from years to decades, distinct from a directional long-term trend.","Anthropogenic climate change":"Anthropogenic climate change is the alteration of global and regional climate caused primarily by human activities, especially the emission of greenhouse gases from fossil-fuel combustion and land-use change.","Climate modelling":"Climate modelling uses mathematical representations of atmospheric, oceanic and land-surface processes to simulate past, present and future climate under different scenarios.","Climate impacts":"Climate impacts are the observed or projected effects of climate change on natural and human systems, including sea-level rise, shifting ecosystems, altered agriculture and increased extreme-weather risk.","Climate vulnerability":"Climate vulnerability is the degree to which a system, population or place is susceptible to and unable to cope with the adverse effects of climate change.","Climate resilience":"Climate resilience is the capacity of a system or community to anticipate, absorb, adapt to and recover from climate-related shocks and stresses.","Climate justice":"Climate justice frames climate change as an ethical and political issue, addressing the unequal distribution of its causes, impacts and response burdens across nations, generations and social groups.","Climate policy":"Climate policy comprises the laws, regulations, targets and international agreements designed to mitigate greenhouse-gas emissions and support adaptation to climate change.","Carbon cycle":"The carbon cycle is the continuous movement of carbon between the atmosphere, oceans, land, and living organisms, through processes such as photosynthesis, respiration, decomposition and fossil-fuel combustion.","Carbon emissions":"Carbon emissions are the release of carbon dioxide and other carbon-based greenhouse gases into the atmosphere, primarily from burning fossil fuels, deforestation and industrial processes.","Carbon sequestration":"Carbon sequestration is the capture and long-term storage of atmospheric carbon dioxide, occurring naturally in forests, soils and oceans, or artificially through technologies such as carbon capture and storage.","Percolation":"Percolation is the downward movement of water through soil and porous rock under gravity, moving water from the surface toward the water table.","Groundwater":"Groundwater is water stored beneath the surface within the pore spaces and fractures of soil and rock, forming a major reservoir in the hydrological cycle and source of freshwater supply.","Transpiration":"Transpiration is the release of water vapour from plant leaves and stems into the atmosphere, part of the plant's process of drawing water up from the soil.","Evapotranspiration":"Evapotranspiration is the combined loss of water to the atmosphere through evaporation from surfaces and transpiration from vegetation.","Lakes":"Lakes are inland bodies of standing water, typically freshwater, occupying basins formed by tectonic, glacial, volcanic or other processes.","Reservoirs":"Reservoirs are artificial or artificially enlarged lakes created, typically by damming a river, to store water for supply, irrigation, flood control or hydroelectric generation.","Wetlands":"Wetlands are areas where the land is saturated or covered by water for all or part of the year, supporting distinctive water-tolerant vegetation and providing flood regulation and habitat functions.","Swamps":"Swamps are wetlands dominated by trees and woody vegetation growing in waterlogged or seasonally flooded soil.","Marshes":"Marshes are wetlands dominated by herbaceous, non-woody vegetation such as grasses and reeds, typically found along shallow lake, river and coastal margins.","Ponds":"Ponds are small, shallow bodies of standing water, generally smaller than lakes, that may be natural or artificially constructed.","Drainage basins":"A drainage basin is the total area of land whose surface runoff and groundwater ultimately drain to a common river, lake or outlet.","Water tables":"The water table is the upper surface of the saturated zone in the ground, below which pores and fractures are filled with groundwater.","Springs":"A spring is a natural point at which groundwater emerges at the surface, occurring where the water table intersects the ground or where an aquifer is breached.","Groundwater recharge":"Groundwater recharge is the process by which water infiltrates through soil and rock to replenish an aquifer, primarily from precipitation, rivers or deliberate artificial recharge.","Groundwater discharge":"Groundwater discharge is the natural or artificial release of groundwater to the surface, such as at springs, into rivers and wetlands, or through wells.","Wells":"A well is a constructed shaft or borehole used to access groundwater from an aquifer for water supply.","Groundwater pollution":"Groundwater pollution is the contamination of aquifers by pollutants such as agricultural chemicals, sewage, industrial waste or saltwater intrusion, often persisting for long periods due to slow underground flow.","Water availability":"Water availability refers to the quantity of freshwater accessible to meet human and ecological needs within a given area and time period.","Water scarcity":"Water scarcity is a condition in which demand for freshwater exceeds the available, accessible and sustainable supply within a region.","Water security":"Water security is the reliable availability of an acceptable quantity and quality of water for health, livelihoods, ecosystems and production, combined with an acceptable level of water-related risk.","Water quality":"Water quality describes the chemical, physical and biological characteristics of water in relation to its suitability for drinking, ecosystems, agriculture or industry.","Water management":"Water management encompasses the planning, development, distribution and regulation of water resources to balance competing human and environmental demands.","Irrigation":"Irrigation is the artificial application of water to land to support crop growth in areas where natural rainfall is insufficient or unreliable.","Dams":"Dams are engineered barriers built across rivers to impound water for storage, flood control, irrigation or hydroelectric power generation.","Hydroelectricity":"Hydroelectricity is electrical power generated by using the energy of falling or flowing water, typically at a dam, to turn turbines.","Transboundary water":"Transboundary water resources are rivers, lakes or aquifers that cross or form international borders, requiring cooperative management between the states that share them.","Integrated water resources management":"Integrated water resources management is a coordinated approach to developing and managing water, land and related resources to maximise economic and social welfare without compromising ecosystem sustainability.","Oceans":"Oceans are the vast, interconnected bodies of saltwater covering about 71% of Earth's surface, central to global climate regulation, the water cycle and marine life.","Seas":"Seas are generally smaller, partially enclosed bodies of saltwater connected to an ocean, often bordered by land on several sides.","Ocean basins":"Ocean basins are the large depressions in Earth's crust occupied by the oceans, containing features such as continental shelves, abyssal plains, mid-ocean ridges and deep trenches.","Ocean currents":"Ocean currents are persistent, directed movements of seawater driven by wind, temperature and salinity differences, and Earth's rotation, redistributing heat across the globe.","Salinity":"Salinity is the concentration of dissolved salts in water, typically expressed in parts per thousand, and a key control on seawater density and ocean circulation.","Marine ecosystems":"Marine ecosystems are the communities of organisms and their physical environment within oceans and seas, ranging from coral reefs and kelp forests to the open ocean and deep sea.","Deep ocean":"The deep ocean is the region below the sunlit surface layer, characterised by darkness, high pressure, low temperature and specialised ecosystems, including hydrothermal vent communities.","Seafloor":"The seafloor is the solid surface of the ocean basin, featuring landforms such as continental shelves, abyssal plains, mid-ocean ridges, seamounts and deep trenches.","Exclusive Economic Zones":"Exclusive Economic Zones extend up to 200 nautical miles from a coastal state's baseline, granting it sovereign rights to explore and exploit marine resources within that zone.","Maritime boundaries":"Maritime boundaries are internationally recognised limits, such as territorial seas and Exclusive Economic Zones, that define states' rights and jurisdiction over ocean areas.","Food webs":"A food web is the interconnected network of multiple, overlapping food chains within an ecosystem, showing the complex feeding relationships among organisms.","Energy flow":"Energy flow describes the one-directional passage of energy through an ecosystem, from solar input captured by producers through successive levels of consumers, with energy lost as heat at each transfer.","Nutrient cycles":"Nutrient cycles are the pathways by which chemical elements such as nitrogen, carbon and phosphorus move between living organisms and the physical environment.","Ecological succession":"Ecological succession is the gradual, directional change in the species composition of an ecological community over time, following a disturbance (secondary succession) or on newly formed substrate (primary succession).","Habitats":"A habitat is the specific physical environment in which a particular species lives, providing the resources and conditions it needs to survive and reproduce.","Niches":"An ecological niche is the specific role and position a species occupies within its ecosystem, including its habitat use, resource needs and interactions with other species.","Population ecology":"Population ecology studies the size, density, distribution and dynamics of populations of a single species over time and space.","Community ecology":"Community ecology studies the composition, structure and interactions among the multiple species that co-occur within a given area.","Distribution of species":"The distribution of a species describes the geographic area over which it is found, shaped by climate, habitat availability, dispersal ability and interactions with other species.","Flora":"Flora refers to the plant life characteristic of a particular region, period or environment.","Fauna":"Fauna refers to the animal life characteristic of a particular region, period or environment.","Endemic species":"Endemic species are species found naturally in only one specific geographic region and nowhere else, often due to geographic isolation.","Invasive species":"Invasive species are non-native organisms introduced, deliberately or accidentally, to a new environment where they spread aggressively and cause ecological or economic harm.","Migration":"In biogeography, migration is the regular, often seasonal, movement of animals between different geographic areas, typically related to breeding, feeding or climate.","Species dispersal":"Species dispersal is the movement of organisms or their propagules (seeds, spores, larvae) away from their point of origin, expanding or shifting a species' range.","Biogeographical regions":"Biogeographical regions are large areas of Earth's surface characterised by relatively distinct assemblages of plant and animal species, shaped by historical geological and climatic isolation.","Island biogeography":"The theory of island biogeography explains species richness on islands as a balance between immigration and extinction rates, influenced by island size and distance from a mainland source.","Tropical rainforest":"Tropical rainforest is a biome found near the Equator, characterised by high, year-round rainfall and temperature, and exceptionally high biodiversity and structural complexity.","Tropical savanna":"Tropical savanna is a biome of grassland with scattered trees, found in tropical regions with a pronounced wet and dry season.","Desert":"As a biome, desert is characterised by very low and unreliable precipitation, sparse vegetation adapted to aridity, and large temperature extremes.","Mediterranean":"The Mediterranean biome is characterised by hot, dry summers and mild, wet winters, supporting drought-adapted shrubland vegetation such as chaparral or maquis.","Temperate grassland":"Temperate grassland is a biome dominated by grasses, with cold winters and warm summers and insufficient rainfall to support extensive tree cover, exemplified by the prairies and steppes.","Temperate forest":"Temperate forest is a biome of the mid-latitudes with moderate rainfall and pronounced seasons, typically dominated by broadleaf deciduous or mixed deciduous–coniferous trees.","Boreal forest":"Boreal forest, or taiga, is a biome of high northern latitudes dominated by coniferous trees, with long, cold winters and short summers.","Tundra":"Tundra is a biome of high latitudes or high altitudes characterised by extremely cold temperatures, permafrost, and low-growing vegetation such as mosses, lichens and dwarf shrubs.","Alpine environments":"Alpine environments occur above the treeline in mountain regions, characterised by cold temperatures, strong winds, thin soils and specially adapted low vegetation.","Biodiversity conservation":"Biodiversity conservation encompasses efforts to protect the variety of genes, species and ecosystems, through measures such as protected areas, habitat restoration and species management.","Protected areas":"Protected areas are geographically defined zones designated and managed to conserve nature, biodiversity or associated cultural resources, often with legal restrictions on land use.","National parks":"National parks are large protected areas designated by government for conservation, recreation and education, typically restricting extractive activities such as logging and mining.","Wildlife reserves":"Wildlife reserves are protected areas established primarily to conserve animal populations and their habitats.","Forest conservation":"Forest conservation encompasses practices and policies aimed at protecting forests from degradation, deforestation and unsustainable exploitation.","Marine conservation":"Marine conservation encompasses efforts to protect ocean ecosystems, species and resources, including marine protected areas, fisheries management and pollution control.","Habitat fragmentation":"Habitat fragmentation is the breaking up of a large, continuous habitat into smaller, isolated patches, typically due to land-use change, which can reduce biodiversity and disrupt species movement.","Deforestation":"Deforestation is the large-scale removal or clearing of forest, typically to convert land to agriculture, settlement or other uses, resulting in habitat loss and carbon emissions.","Desertification":"Desertification is the process by which fertile land becomes increasingly arid and degraded, typically due to a combination of climate variability and unsustainable land use.","Species extinction":"Species extinction is the complete disappearance of a species, which may occur naturally over geological time or be accelerated by human-driven habitat loss, overexploitation and climate change.","Restoration ecology":"Restoration ecology is the science and practice of assisting the recovery of degraded, damaged or destroyed ecosystems toward a healthier, more natural state.","Conservation planning":"Conservation planning is the systematic process of identifying priority areas and actions for biodiversity conservation, balancing ecological value with social and economic constraints.","Soil horizons":"Soil horizons are distinct, roughly horizontal layers within a soil profile that differ in composition, texture and colour, formed through pedogenic processes over time.","Soil texture":"Soil texture refers to the relative proportions of sand, silt and clay particles in a soil, which strongly influence its drainage, aeration and nutrient-holding capacity.","Soil structure":"Soil structure describes how individual soil particles are aggregated into larger clumps or peds, affecting porosity, root penetration and water movement.","Soil colour":"Soil colour, often described using standardised colour charts, reflects mineral composition, organic-matter content and drainage conditions, and is used to help classify and interpret soils.","Soil fertility":"Soil fertility is a soil's capacity to supply essential nutrients and favourable physical and chemical conditions to support plant growth.","Soil moisture":"Soil moisture is the amount of water held within the pore spaces of soil, a critical control on plant growth, infiltration and runoff generation.","Soil organic matter":"Soil organic matter consists of decomposed plant and animal residues within soil, improving fertility, structure and water-holding capacity.","Soil pH":"Soil pH measures the acidity or alkalinity of soil, which influences nutrient availability, microbial activity and the range of plants that can grow successfully.","Laterite":"Laterite is a reddish, iron- and aluminium-rich soil that forms through intense chemical weathering in hot, wet tropical climates, often hardening irreversibly on exposure to air.","Alluvial soils":"Alluvial soils are young, fertile soils formed from sediment deposited by rivers, common in floodplains and deltas.","Chernozem":"Chernozem, or black earth, is a dark, humus-rich, highly fertile soil that develops under temperate grassland vegetation, notably in the steppes of Ukraine and Russia.","Podzol":"Podzol is an acidic, nutrient-poor soil typical of cool, humid coniferous forest regions, characterised by a bleached, leached upper layer above a darker layer of accumulated iron and organic matter.","Vertisol":"Vertisol is a clay-rich soil that shrinks and cracks deeply when dry and swells when wet, common in seasonally dry tropical and subtropical regions.","Arid soils":"Arid soils, typical of deserts, are thin, low in organic matter and often high in salts, reflecting minimal weathering and vegetation under low rainfall.","Volcanic soils":"Volcanic soils, or andisols, develop from volcanic ash and other pyroclastic material and are often notably fertile due to their mineral content.","Tropical soils":"Tropical soils, such as heavily weathered oxisols, form under high temperature and rainfall, and are often deeply leached, acidic and low in nutrients despite supporting lush vegetation.","Soil erosion":"Soil erosion is the removal of topsoil by water, wind or human activity faster than it can naturally form, reducing land fertility and productivity.","Salinization":"Salinization is the build-up of salts in soil, often caused by poor-drainage irrigation in arid and semi-arid climates, reducing soil fertility and crop viability.","Acidification":"Soil acidification is the process by which soil pH decreases over time, due to factors such as leaching, acid deposition or certain fertilisers, reducing the availability of some nutrients.","Compaction":"Soil compaction is the compression of soil particles, often by heavy machinery or livestock, that reduces pore space, restricting root growth, water infiltration and aeration.","Nutrient depletion":"Nutrient depletion is the reduction of essential soil nutrients through continuous cropping, erosion or leaching without adequate replenishment.","Contamination":"Soil contamination is the presence of harmful substances, such as heavy metals, industrial chemicals or pesticides, at concentrations that pose risks to health or ecosystems.","Soil conservation":"Soil conservation encompasses practices such as terracing, contour ploughing, cover cropping and agroforestry that protect soil from erosion and degradation.","Sustainable soil management":"Sustainable soil management involves practices that maintain or enhance soil health, fertility and productivity over the long term while minimising environmental harm.","Population distribution":"Population distribution describes the pattern of where people live across a given area, typically uneven and influenced by climate, resources, terrain, economic opportunity and history.","Birth rate":"The birth rate, or crude birth rate, is the number of live births per 1,000 people in a population during a given year.","Death rate":"The death rate, or crude death rate, is the number of deaths per 1,000 people in a population during a given year.","Fertility":"Fertility, commonly measured as the total fertility rate, is the average number of children a woman would have in her lifetime given current age-specific birth rates.","Mortality":"Mortality refers to the incidence of death within a population, often analysed by age, cause or region to assess health conditions and risks.","Life expectancy":"Life expectancy is the average number of years a person is expected to live, based on current age-specific mortality rates in a population.","Population structure":"Population structure describes the composition of a population by characteristics such as age and sex, commonly visualised using a population pyramid.","Age structure":"Age structure is the distribution of a population across different age groups, which shapes future demographic trends, dependency levels and labour-force supply.","Sex structure":"Sex structure is the ratio of males to females within a population, which can be affected by biology, migration, conflict and social practices.","Dependency ratio":"The dependency ratio compares the number of people typically outside the working-age range (children and elderly) to the number of working-age people, indicating the economic burden on the productive population.","Population pyramids":"A population pyramid is a graphical representation of a population's age and sex structure, used to compare demographic profiles and identify trends such as growth, ageing or population decline.","Carrying capacity":"Carrying capacity is the maximum population size that an environment can sustainably support given available resources, without long-term degradation.","Internal migration":"Internal migration is the movement of people from one place to another within the same country.","International migration":"International migration is the movement of people across national borders to live, work or settle in another country.","Rural–urban migration":"Rural–urban migration is the movement of people from rural areas to cities, commonly driven by the search for employment, services and perceived opportunity.","Immigration":"Immigration is the process of entering and settling in a country other than one's country of origin.","Emigration":"Emigration is the process of leaving one's country of origin to settle elsewhere.","Refugees":"Refugees are people who have fled their country due to persecution, conflict or violence and are unable or unwilling to return, protected under international law.","Displacement":"Displacement is the forced movement of people from their homes, whether within their own country (internal displacement) or across borders, often due to conflict, disaster or development projects.","Forced migration":"Forced migration is movement undertaken under compulsion, such as fleeing conflict, persecution, disaster or development-induced displacement, as opposed to a voluntary choice.","Voluntary migration":"Voluntary migration is movement undertaken by choice, typically motivated by factors such as employment, education, family or lifestyle.","Brain drain":"Brain drain is the emigration of highly skilled or educated individuals from their home country, often to seek better economic or professional opportunities elsewhere.","Brain gain":"Brain gain is the net inflow of skilled and educated migrants into a country or region, benefiting the receiving economy.","Migration networks":"Migration networks are social connections between migrants, former migrants and non-migrants in origin and destination areas that facilitate and sustain further migration through shared information and support.","Remittances":"Remittances are money sent by migrants to family or communities in their country of origin, forming a significant source of income for many developing economies.","Migration policy":"Migration policy comprises the laws and regulations governments use to manage the entry, stay, employment and rights of migrants.","Rural settlements":"Rural settlements are small, dispersed or clustered communities typically engaged in agriculture or resource-based activities, with lower population densities than urban areas.","Urban settlements":"Urban settlements are larger, more densely populated and built-up communities, typically characterised by non-agricultural economic activity and complex infrastructure.","Villages":"Villages are small rural settlements, typically comprising a modest cluster of homes and basic local services.","Towns":"Towns are settlements intermediate in size and function between villages and cities, offering a wider range of services than a village but smaller than a city.","Cities":"Cities are large, dense, permanent settlements with diverse economic, social, administrative and cultural functions serving a wider surrounding region.","Megacities":"Megacities are urban agglomerations with a population of at least 10 million people.","Metropolitan areas":"A metropolitan area is a large urban core together with its surrounding, economically and socially integrated commuter zone.","Conurbations":"A conurbation is an extensive urban region formed by the merging of several formerly separate towns or cities as they expand.","Urban corridors":"Urban corridors are linear zones of continuous or near-continuous urban development connecting major cities, often along transport routes.","Settlement patterns":"Settlement patterns describe the spatial arrangement of dwellings and communities across an area, classified as dispersed, nucleated or linear, among other forms.","Site and situation":"Site refers to the actual physical characteristics of a settlement's location, while situation refers to its position relative to surrounding places, resources and transport routes.","Urban hierarchy":"Urban hierarchy is the ranking of settlements by size and the range and level of functions and services they provide, from small villages up to global cities.","Urban growth":"Urban growth is the increase in the population or built-up area of a city or town over time.","Urban expansion":"Urban expansion is the outward physical growth of a city's built-up area into previously undeveloped or rural land.","Suburbanization":"Suburbanization is the growth of residential and commercial development on the outer edges of cities, often associated with lower density and increased reliance on private transport.","Counter-urbanization":"Counter-urbanization is the movement of people from large cities to smaller towns and rural areas, reversing the typical direction of urbanization.","Reurbanization":"Reurbanization is the process of population and investment returning to previously declining inner-city areas, often through redevelopment and regeneration.","Informal settlements":"Informal settlements are residential areas that develop outside formal planning and legal land-tenure systems, often lacking secure land rights and adequate infrastructure.","Slums":"Slums are densely populated urban areas characterised by substandard housing, inadequate infrastructure and services, and often insecure tenure.","Urban segregation":"Urban segregation is the spatial separation of population groups, often by income, ethnicity or class, into distinct residential areas within a city.","Central Business District":"The Central Business District is the commercial and often historic core of a city, characterised by high land values, dense office and retail development, and concentrated employment.","Residential zones":"Residential zones are areas of a city designated primarily for housing, ranging from high-density apartments to low-density suburban neighbourhoods.","Industrial zones":"Industrial zones are areas of a city designated for manufacturing, warehousing and related activities, often located for access to transport infrastructure.","Commercial areas":"Commercial areas are zones of a city devoted to retail, offices and services, ranging from the central business district to smaller neighbourhood centres.","Suburbs":"Suburbs are predominantly residential areas on the outskirts of a city, generally of lower density than the urban core.","Inner city":"The inner city is the area immediately surrounding a city's central business district, often characterised by older housing stock and, in some cities, by social and economic challenges.","Peri-urban areas":"Peri-urban areas are transitional zones at the edge of cities where urban and rural land uses intermix, often experiencing rapid change as cities expand.","Urban land use":"Urban land use describes how land within a city is allocated among functions such as residential, commercial, industrial, institutional and recreational purposes.","Smart cities":"Smart cities use digital technology, sensors and data analytics to improve the efficiency, sustainability and quality of urban services and infrastructure.","Sustainable cities":"Sustainable cities are urban areas designed and managed to meet residents' needs while minimising environmental impact and ensuring long-term social and economic viability.","Transport systems":"Urban transport systems comprise the networks and modes — roads, rail, buses and pedestrian and cycling infrastructure — that move people and goods within a city.","Public services":"Public services are essential functions such as education, healthcare, sanitation, water supply and policing provided to residents by government or municipal authorities.","Housing":"Housing refers to the stock of dwellings available in a settlement, encompassing issues of supply, affordability, quality and tenure.","Urban infrastructure":"Urban infrastructure comprises the physical systems — roads, utilities, water and sewage networks, and communications — that support the functioning of a city.","Waste management":"Waste management encompasses the collection, transport, processing and disposal or recycling of solid and other waste generated within a settlement.","Water supply":"Water supply refers to the systems and infrastructure through which a settlement obtains, treats and distributes water for domestic, commercial and industrial use.","Urban energy":"Urban energy refers to the generation, distribution and consumption of energy within cities, a major focus of efforts to reduce carbon emissions and improve efficiency.","Urban governance":"Urban governance is the set of institutions, processes and actors involved in managing and making decisions about a city's development and services.","Urban resilience":"Urban resilience is a city's capacity to anticipate, withstand, adapt to and recover from shocks and stresses such as natural disasters, economic downturns or climate change.","Disaster-ready cities":"Disaster-ready cities are urban areas that have implemented planning, infrastructure and governance measures to reduce risk and improve preparedness and response to natural hazards.","Culture":"Culture is the shared beliefs, values, practices, language and material expressions of a group of people, which vary and diffuse across geographic space.","Language":"Language is a structured system of communication that varies geographically, with its spatial distribution reflecting migration, conquest, trade and cultural contact over time.","Religion":"Religion is a system of belief and practice concerning the sacred or supernatural, whose spatial distribution reflects history, migration and cultural diffusion.","Traditions":"Traditions are customary practices, beliefs or forms of expression passed down within a culture across generations.","Customs":"Customs are established, habitual practices of a community or culture, often governing social behaviour and everyday life.","Food cultures":"Food cultures are the distinctive dietary practices, ingredients and culinary traditions associated with particular regions or social groups, shaped by environment, history and available resources.","Clothing":"Clothing traditions vary geographically in response to climate, available materials, cultural identity and religious practice.","Music":"Music, as a cultural expression, varies geographically in style and instrumentation, reflecting local history, language and cross-cultural exchange.","Architecture":"Architecture reflects geographic variation in building materials, climate adaptation, cultural values and available technology across regions.","Cultural landscapes":"Cultural landscapes are landscapes that bear the visible imprint of human culture and activity, blending natural features with human modification and meaning.","Cultural diffusion":"Cultural diffusion is the spread of cultural traits, ideas or practices from one place or group to another through contact, migration or trade.","Cultural globalization":"Cultural globalization is the increasing interconnection and exchange of cultural practices, values and products across the world, often facilitated by media, trade and migration.","Language families":"Language families are groups of languages descended from a common ancestral language, such as the Indo-European or Sino-Tibetan families.","Language distribution":"Language distribution describes the geographic spread and concentration of different languages and language groups across the world.","Official languages":"Official languages are languages formally designated by a government for use in law, administration and education within a state.","Indigenous languages":"Indigenous languages are languages native to a particular region, spoken by its original inhabitants prior to colonisation or large-scale migration.","Dialects":"Dialects are regional or social variations of a language, differing in pronunciation, vocabulary or grammar while remaining mutually intelligible with the standard form.","Linguistic diversity":"Linguistic diversity is the variety of distinct languages spoken within a given area or population.","Multilingualism":"Multilingualism is the ability to use, or the presence within a society of, multiple languages.","Language extinction":"Language extinction is the process by which a language ceases to have any living native speakers, often due to cultural assimilation or the dominance of a more widely spoken language.","Language change":"Language change is the gradual evolution of a language's vocabulary, grammar and pronunciation over time, influenced by contact with other languages and social change.","Place names / toponymy":"Toponymy is the study of place names, their origins, meanings and the cultural, historical or linguistic patterns they reveal.","Spatial distribution of religions":"The spatial distribution of religions describes the geographic pattern of where major religious traditions and their adherents are concentrated worldwide.","Sacred places":"Sacred places are sites regarded by a religious tradition as holy or spiritually significant, often becoming focal points for worship and pilgrimage.","Religious landscapes":"Religious landscapes are landscapes shaped by the presence of religious buildings, monuments, land uses and symbolism associated with a faith tradition.","Pilgrimage":"Pilgrimage is a journey undertaken to a sacred site for religious or spiritual purposes, generating characteristic patterns of movement and economic activity.","Religious migration":"Religious migration is the movement of people motivated wholly or partly by religious persecution, freedom or affiliation.","Religious diffusion":"Religious diffusion is the spread of a religion from its place of origin to other regions through migration, trade, conquest or missionary activity.","Secularization":"Secularization is the process by which religion's social and institutional influence declines within a society over time.","Social groups":"Social groups are collections of people who share identity, interaction or common characteristics, whose spatial patterns and interactions geographers study.","Communities":"Communities are groups of people connected by shared location, identity or interest, often studied geographically in terms of their spatial cohesion and social networks.","Gender and space":"Gender and space examines how gender shapes, and is shaped by, the use, experience and control of space, including access to public space, mobility and safety.","Inequality":"Inequality refers to the uneven distribution of resources, opportunities or outcomes among individuals or groups, which geographers examine for its spatial patterns and causes.","Poverty":"Poverty is the state of lacking sufficient material resources or income to meet basic needs, with geographers examining its spatial concentration and underlying causes.","Social exclusion":"Social exclusion is the process by which individuals or groups are systematically denied full participation in economic, social or political life.","Segregation":"Segregation is the spatial separation of population groups, often based on race, ethnicity, income or religion, within a city or region.","Social mobility":"Social mobility is the movement of individuals or groups between different social or economic positions, often studied in relation to geographic location and opportunity.","Quality of life":"Quality of life is a broad measure of individual or community well-being, encompassing material living standards alongside health, environment, safety and social conditions.","Well-being":"Well-being refers to a state of physical, mental and social welfare, increasingly used alongside or instead of purely economic indicators to assess development.","Access to services":"Access to services describes the degree to which people can reach and use essential services such as healthcare, education and utilities, shaped by distance, cost and infrastructure.","Natural resources":"Natural resources are materials or components of the environment, such as minerals, water, forests and fossil fuels, that have economic value and are used by people.","Production":"Production is the process of creating goods or services from raw materials, labour and capital, whose location geographers study in relation to resources, labour and markets.","Consumption":"Consumption is the use of goods and services to satisfy needs and wants, whose geographic patterns reflect income, culture and access to markets.","Trade":"Trade is the exchange of goods and services between individuals, regions or countries, generating flows that geographers map and analyse.","Markets":"Markets are places or systems in which buyers and sellers exchange goods and services, ranging from local marketplaces to global commodity exchanges.","Industries":"Industries are groups of businesses engaged in similar economic activity, whose location patterns are shaped by resources, labour, transport and markets.","Labour":"Labour, in economic geography, refers to the human workforce and its geographic distribution, skills, cost and mobility, which strongly influence where economic activity locates.","Employment":"Employment is paid work undertaken by individuals, whose geographic distribution reflects the location of industries, services and economic opportunity.","Globalization":"Globalization is the increasing economic, cultural and political interconnection of countries and regions worldwide, driven by trade, investment, migration, and communication technology.","Economic development":"Economic development is the process by which an economy's productive capacity, income levels and standard of living improve over time.","Fishing":"Fishing is a primary economic activity involving the harvesting of fish and other aquatic organisms from oceans, rivers and lakes.","Forestry":"Forestry is a primary economic activity involving the management and harvesting of forest resources, including timber and non-timber products.","Mining":"Mining is a primary economic activity involving the extraction of minerals, ores and other geological materials from the Earth.","Quarrying":"Quarrying is the extraction of stone, sand, gravel or other surface materials from an open pit, typically for construction use.","Hunting":"Hunting is a primary economic activity involving the pursuit and capture of wild animals for food, materials or other purposes.","Livestock":"Livestock refers to domesticated animals raised for food, labour, materials or other products, forming a major component of agricultural economies.","Manufacturing":"Manufacturing is a secondary economic activity in which raw materials or components are processed and assembled into finished goods.","Processing":"Processing is a secondary economic activity that transforms raw materials into more usable or valuable intermediate or finished products.","Construction":"Construction is a secondary economic activity involving the building of infrastructure, housing and other structures.","Industrialization":"Industrialization is the process by which an economy transforms from primarily agricultural to one dominated by manufacturing and industrial production.","Industrial location":"Industrial location theory examines the factors — such as raw materials, labour, transport costs and markets — that determine where manufacturing activity is situated.","Industrial clusters":"Industrial clusters are geographic concentrations of interconnected firms, suppliers and institutions within a particular industry, benefiting from shared labour pools, knowledge spillovers and supply chains.","Special economic zones":"Special economic zones are designated areas within a country offering distinct economic regulations, incentives and infrastructure to attract investment and boost exports.","Banking":"Banking is a tertiary economic activity providing financial services such as deposits, loans and payments, typically concentrated in major commercial centres.","Retail":"Retail is a tertiary economic activity involving the sale of goods directly to consumers, whose locational pattern is shaped by accessibility and population density.","Tourism":"Tourism is a tertiary economic activity involving travel for leisure, business or other purposes, generating significant economic and environmental impacts in destination areas.","Transport":"Transport is a tertiary economic activity providing the movement of people and goods, underpinning trade, commuting and access to services.","Communications":"Communications is a tertiary economic activity comprising the transmission of information via telecommunications, media and postal systems.","Education":"Education, as a tertiary economic activity, provides instruction and skills development, whose accessibility varies significantly by location and socioeconomic status.","Healthcare":"Healthcare, as a tertiary economic activity, provides medical services, whose accessibility and quality vary significantly across regions.","Insurance":"Insurance is a tertiary economic activity providing financial protection against risk, typically concentrated in major financial centres.","Hospitality":"Hospitality is a tertiary economic activity encompassing accommodation, food service and related tourism-support businesses.","Research":"Research, as a quaternary economic activity, involves the generation of new knowledge, often concentrated in universities, laboratories and innovation hubs.","Information technology":"Information technology is a quaternary economic activity involving the development and application of computing and data systems, often clustered in specialised technology hubs.","Data services":"Data services are quaternary economic activities involving the collection, storage, processing and analysis of information for clients or the public.","Knowledge industries":"Knowledge industries are quaternary economic sectors whose primary output is specialised information, expertise or intellectual property rather than physical goods.","Innovation":"Innovation is the creation and application of new ideas, products or processes, often geographically clustered in hubs that combine research institutions, capital and skilled labour.","Scientific services":"Scientific services are quaternary economic activities providing specialised technical and research expertise to other businesses or institutions.","Government leadership":"Government leadership, a quinary economic function, involves high-level decision-making within public institutions that shapes policy and resource allocation.","Corporate leadership":"Corporate leadership, a quinary economic function, involves top-level strategic decision-making within businesses, often concentrated in global and regional headquarters cities.","Policy-making":"Policy-making, a quinary economic activity, is the process of formulating official rules, plans and regulations that guide government and institutional action.","High-level decision-making":"High-level decision-making refers to the quinary-sector work of senior executives and officials who set overall strategy and direction for organisations and governments.","Specialized professional services":"Specialised professional services are quinary economic activities providing high-level expert advice, such as in law, finance or consulting, typically concentrated in major global cities.","Subsistence agriculture":"Subsistence agriculture is farming primarily to meet the food needs of the farming household, with little surplus produced for sale.","Commercial agriculture":"Commercial agriculture is farming conducted primarily to produce crops or livestock for sale in the market, often at a large scale.","Plantation agriculture":"Plantation agriculture is large-scale commercial farming of a single cash crop, such as coffee, rubber or sugar, historically associated with colonial economies.","Intensive agriculture":"Intensive agriculture uses high inputs of labour, capital, fertiliser or technology per unit of land to maximise yield.","Extensive agriculture":"Extensive agriculture uses relatively low inputs per unit of land, typically over large areas, such as ranching or dryland cereal farming.","Mixed farming":"Mixed farming combines both crop cultivation and livestock rearing on the same farm.","Livestock farming":"Livestock farming is the raising of domesticated animals for meat, milk, wool or other products.","Pastoralism":"Pastoralism is a livelihood based on the herding of livestock, often on natural or semi-natural grazing land, and may be sedentary or migratory.","Nomadic pastoralism":"Nomadic pastoralism is a form of pastoralism in which herders move their livestock seasonally or continuously in search of pasture and water, typically in arid or semi-arid regions.","Irrigated agriculture":"Irrigated agriculture relies on the artificial application of water to supplement or replace natural rainfall for crop production.","Rain-fed agriculture":"Rain-fed agriculture depends entirely on natural precipitation for crop water needs, without irrigation.","Relief":"Relief refers to the variation in elevation of the land surface within an area, a key factor influencing agricultural suitability and land use.","Water (agricultural location)":"Water availability, from rainfall, rivers or groundwater, is a fundamental factor determining what agricultural systems can be practised in a given location.","Technology (agriculture)":"Agricultural technology, including machinery, irrigation, seed varieties and digital tools, influences where and how intensively land can be farmed.","Food systems":"Food systems encompass all the activities, actors and processes involved in producing, processing, distributing, consuming and disposing of food.","Food production":"Food production is the growing, raising or harvesting of crops, livestock or other food sources.","Food distribution":"Food distribution is the process of moving food from producers to consumers through supply chains, markets and retail networks.","Food consumption":"Food consumption refers to patterns of what, how much and how food is eaten by populations, which vary geographically and culturally.","Food sovereignty":"Food sovereignty is the right of peoples to define their own food and agriculture systems, emphasising local control over production methods and food culture.","Nutrition":"Nutrition is the study of how food provides the nourishment organisms need for health, whose geographic patterns reflect food availability, income and culture.","Famine":"Famine is a severe, widespread shortage of food leading to acute malnutrition and starvation, often caused by a combination of environmental, economic and political factors.","Hunger":"Hunger refers to the physical discomfort caused by insufficient food intake, and at a population level indicates inadequate access to nutrition.","Agricultural supply chains":"Agricultural supply chains are the interconnected sequence of processes — production, processing, transport, distribution and retail — that move food from farm to consumer.","Food loss":"Food loss refers to the decrease in edible food quantity or quality that occurs before food reaches the retail stage, often due to poor storage, handling or infrastructure.","Food waste":"Food waste refers to edible food that is discarded or left unconsumed at the retail or consumer stage of the supply chain.","Agroecology":"Agroecology applies ecological principles to the design and management of sustainable agricultural systems, emphasising biodiversity and reduced external inputs.","Organic farming":"Organic farming is an agricultural approach that avoids synthetic fertilisers and pesticides, relying instead on natural processes and inputs to maintain soil fertility and control pests.","Conservation agriculture":"Conservation agriculture is a farming approach based on minimal soil disturbance, permanent soil cover and crop rotation, aimed at protecting soil health and productivity.","Climate-smart agriculture":"Climate-smart agriculture aims to sustainably increase productivity and resilience while reducing greenhouse-gas emissions from farming.","Agroforestry":"Agroforestry integrates trees and shrubs with crops or livestock on the same land, providing ecological and economic benefits.","Irrigation management":"Irrigation management involves planning and controlling the timing, amount and method of water application to optimise crop yield and conserve water.","Drought-resistant crops":"Drought-resistant crops are plant varieties bred or selected for their ability to maintain yield under conditions of limited water availability.","Sustainable livestock":"Sustainable livestock production seeks to raise animals in ways that maintain productivity while minimising environmental impacts such as land degradation and emissions.","States":"In political geography, a state is a sovereign political entity with defined territory, a permanent population, a government, and the capacity to enter into relations with other states.","Nations":"A nation is a group of people who share a common identity, such as language, culture, history or ethnicity, and often aspire to or possess self-governance.","Nation-states":"A nation-state is a sovereign state whose population largely corresponds with a single national identity or culture.","Sovereignty":"Sovereignty is the supreme authority of a state to govern itself and its territory without external interference.","Boundaries":"Boundaries are lines that delimit the extent of a state's or region's territory, whether on land or at sea.","Frontiers":"Frontiers are transitional zones, historically often broad and undefined, that separate one political territory from another, distinct from a precisely delimited boundary line.","Political regions":"Political regions are areas defined by shared governmental or administrative jurisdiction, such as countries, states or provinces.","Natural boundaries":"Natural boundaries are political borders that follow physical features such as rivers, mountain ranges or coastlines.","Artificial boundaries":"Artificial boundaries are political borders defined by straight lines or geometric coordinates rather than physical features, often established through treaties or colonial agreements.","Land boundaries":"Land boundaries are political borders that run across terrestrial territory, separating neighbouring states.","Disputed boundaries":"Disputed boundaries are borders whose precise location or legitimacy is contested by two or more states.","Borderlands":"Borderlands are the regions immediately surrounding a political boundary, often characterised by distinct cross-border economic, cultural and social interactions.","Cross-border relations":"Cross-border relations are the economic, political and social interactions that occur between neighbouring states or their border populations.","Global power":"A global power is a state with the military, economic and political capacity to project significant influence worldwide.","Regional power":"A regional power is a state with substantial influence over the political and economic affairs of its surrounding region.","Geostrategy":"Geostrategy is the application of geographic factors, such as location, terrain and resources, to the planning and conduct of national security and foreign policy.","Strategic resources":"Strategic resources are natural resources considered critical to a state's economic or military security, such as oil, rare minerals or fresh water.","International relations":"International relations is the study of interactions between states and other global actors, including diplomacy, conflict, trade and cooperation.","Alliances":"Alliances are formal agreements between states to cooperate for mutual benefit, often in matters of defence or security.","Territorial disputes":"Territorial disputes are disagreements between states or groups over the ownership or control of a particular area of land or sea.","Maritime geopolitics":"Maritime geopolitics examines how control of sea routes, chokepoints and maritime resources shapes international power relations.","Resource geopolitics":"Resource geopolitics examines how the location, control and trade of natural resources shape international relations and conflict.","Voting patterns":"Voting patterns describe the spatial distribution of electoral support for different parties or candidates across a region.","Electoral districts":"Electoral districts are geographically defined areas within which votes are cast and counted to elect a representative.","Constituencies":"A constituency is the body of voters within an electoral district who elect a representative to a legislative body.","Gerrymandering":"Gerrymandering is the manipulation of electoral district boundaries to favour a particular political party or group.","Political participation":"Political participation refers to the ways citizens engage in political processes, such as voting, campaigning or civic activism, whose patterns vary geographically.","Spatial voting behaviour":"Spatial voting behaviour examines the geographic patterns and clustering of political preferences and voting outcomes.","Human development":"Human development is a broad measure of well-being encompassing health, education and living standards, rather than income alone.","Sustainable development":"Sustainable development is development that meets present needs without compromising the ability of future generations to meet their own needs, balancing economic, social and environmental goals.","Social development":"Social development refers to improvements in the social welfare and institutions of a society, including education, health and equity.","Regional development":"Regional development refers to policies and processes aimed at improving the economic and social conditions of a specific region.","Rural development":"Rural development refers to efforts to improve the economic and social well-being of people living in rural areas.","Urban development":"Urban development refers to the planned or unplanned growth and improvement of a city's infrastructure, economy and built environment.","GNI":"Gross National Income (GNI) is the total income earned by a country's residents and businesses, both domestically and abroad, and is used to measure national economic output.","GDP per capita":"GDP per capita is a country's gross domestic product divided by its population, used as a rough measure of average economic output or living standard.","Literacy":"Literacy is the ability to read and write, whose geographic and demographic patterns are used as a key indicator of educational development.","Access to healthcare":"Access to healthcare is the degree to which a population can obtain needed medical services, influenced by distance, cost and availability of facilities.","Access to water":"Access to water refers to the degree to which a population has a reliable, safe and affordable water supply.","Access to electricity":"Access to electricity refers to the proportion of a population with a reliable connection to an electricity supply.","Underdevelopment":"Underdevelopment describes a state of limited economic growth, low living standards and inadequate infrastructure relative to more developed regions.","Economic dependency":"Economic dependency describes a situation in which a country's economy relies heavily on external markets, capital or aid, often limiting its autonomous development.","Resource inequality":"Resource inequality refers to the uneven distribution of natural resources, or the benefits derived from them, among regions or social groups.","Gender inequality":"Gender inequality refers to unequal access to resources, opportunities and rights between men and women, with significant geographic variation.","Human capital":"Human capital is the skills, knowledge, health and experience possessed by a population that contribute to economic productivity.","Infrastructure deficits":"Infrastructure deficits refer to shortfalls in the roads, utilities, communication networks and other physical systems needed to support economic and social activity.","Governance":"Governance refers to the systems, institutions and processes through which a society or organisation is directed and managed.","Land":"As a natural resource, land refers to the surface area and associated soil, minerals and biological resources available for human use.","Water (resource)":"As a natural resource, water is essential for drinking, agriculture, industry and ecosystems, and its uneven global distribution shapes patterns of settlement and development.","Forests":"As a natural resource, forests provide timber, non-timber products, carbon storage, biodiversity habitat and ecosystem services.","Fossil fuels":"Fossil fuels — coal, oil and natural gas — are non-renewable energy resources formed from the remains of ancient organisms over millions of years.","Wildlife":"Wildlife refers to undomesticated animal species and their populations, considered as a natural resource for ecological, economic and cultural value.","Fisheries":"Fisheries are the industries and resources associated with the harvesting of fish and other aquatic organisms from oceans, rivers and lakes.","Coal":"Coal is a combustible sedimentary rock formed from compressed ancient plant matter, used mainly as a fuel for electricity generation and industrial processes.","Oil":"Oil, or petroleum, is a liquid fossil fuel formed from ancient organic matter, refined into fuels and petrochemical products.","Natural gas":"Natural gas is a fossil fuel composed mainly of methane, used for heating, electricity generation and as an industrial feedstock.","Hydropower":"Hydropower is electricity generated by harnessing the energy of moving or falling water, typically at a dam.","Solar":"Solar energy is power derived from sunlight, captured using photovoltaic cells or solar-thermal systems.","Geothermal (energy geography)":"Geothermal energy is power derived from heat stored within the Earth, harnessed directly or converted into electricity, particularly in tectonically active regions.","Biomass":"Biomass energy is derived from organic materials such as wood, crop residues or waste, burned or converted to produce heat, electricity or biofuels.","Nuclear energy":"Nuclear energy is electricity generated through the controlled fission of atomic nuclei, typically uranium, within a nuclear reactor.","Energy security":"Energy security is the reliable availability of energy resources at an affordable price, without excessive vulnerability to supply disruption.","Energy transition":"Energy transition refers to the shift of an energy system away from fossil fuels toward renewable and lower-carbon energy sources.","Gold":"Gold is a dense, precious metal mined for use in jewellery, electronics, and as a financial store of value.","Diamonds":"Diamonds are a crystalline form of carbon, valued as gemstones and, due to their hardness, used in industrial cutting and abrasive applications.","Iron ore":"Iron ore is a mineral resource mined and processed to extract iron, the principal raw material for steel production.","Bauxite":"Bauxite is a sedimentary rock mined as the primary ore of aluminium.","Copper":"Copper is a widely mined metal valued for its electrical conductivity, used extensively in wiring, electronics and construction.","Lithium":"Lithium is a lightweight metal mined primarily for use in rechargeable batteries, increasingly important for electric vehicles and energy storage.","Cobalt":"Cobalt is a metal mined largely as a by-product of copper and nickel production, used in rechargeable batteries and high-strength alloys.","Rare earth elements":"Rare earth elements are a group of seventeen metallic elements used in electronics, magnets, renewable-energy technology and defence applications, geographically concentrated in a small number of producing countries.","Mining landscapes":"Mining landscapes are areas whose terrain and land cover have been significantly altered by mineral extraction activity.","Artisanal mining":"Artisanal mining is small-scale, often informal mineral extraction carried out with minimal mechanisation, common in parts of the developing world.","Environmental impacts of mining":"Environmental impacts of mining include land disturbance, water pollution, habitat loss and, in some cases, hazardous waste generation associated with mineral extraction.","Roads":"Roads are engineered land routes for wheeled vehicles, forming the most extensive component of most transport networks.","Railways":"Railways are fixed-track transport systems for moving passengers and freight, valued for efficiency in moving large volumes over long distances.","Airports":"Airports are facilities for aircraft take-off, landing and passenger or cargo handling, forming critical nodes in global transport networks.","Ports":"Ports are coastal or river facilities for loading, unloading and handling ships, forming key nodes in global maritime trade networks.","Shipping":"Shipping is the transport of goods and passengers by sea, forming the backbone of global freight trade due to its low cost per unit for bulk cargo.","Maritime transport":"Maritime transport encompasses the movement of goods and people by sea, including container shipping, bulk carriers and passenger ferries.","Inland waterways":"Inland waterways are navigable rivers, canals and lakes used to transport goods and passengers within a country or region.","Pipelines":"Pipelines are fixed infrastructure used to transport liquids or gases, such as oil, natural gas or water, over long distances.","Public transport":"Public transport comprises shared transport services, such as buses, trains and metros, available to the general public on a fixed route or schedule.","Logistics":"Logistics is the planning and management of the flow of goods, information and resources from origin to point of consumption.","Supply chains":"Supply chains are the interconnected networks of production, processing, transport and distribution that move goods from raw material to final consumer.","Telecommunications":"Telecommunications is the transmission of information over distance by electronic means, including telephone, internet and broadcast networks.","Internet":"The internet is a global network of interconnected computer networks that enables the exchange of digital information, with significant geographic variation in access and speed.","Mobile networks":"Mobile networks are wireless communication infrastructure that enables voice and data services for mobile devices across a geographic area.","Digital connectivity":"Digital connectivity refers to the extent and quality of access to internet and telecommunications infrastructure in a given area.","Information flows":"Information flows are the movement of data, news and knowledge between places, increasingly enabled by digital communication networks.","Digital divide":"The digital divide is the gap between populations with reliable access to modern information and communication technology and those without.","Communication networks":"Communication networks are the physical and digital infrastructure — cables, satellites, towers and exchanges — that carry information between places.","Tourism destinations":"Tourism destinations are places that attract visitors due to their natural, cultural, historical or recreational appeal.","Tourist attractions":"Tourist attractions are specific sites, landmarks or experiences that draw visitors to a destination.","Cultural tourism":"Cultural tourism is travel motivated by interest in a destination's history, arts, traditions and way of life.","Ecotourism":"Ecotourism is responsible travel to natural areas that conserves the environment, sustains local well-being and often involves education about the ecosystem visited.","Adventure tourism":"Adventure tourism involves travel associated with physical activity, exploration or exotic environments, such as hiking, climbing or rafting.","Coastal tourism":"Coastal tourism is travel focused on beach, marine and seaside destinations.","Heritage tourism":"Heritage tourism is travel motivated by interest in historical sites, monuments and cultural heritage.","Religious tourism":"Religious tourism is travel undertaken for pilgrimage, worship or visiting sites of religious significance.","Medical tourism":"Medical tourism is travel undertaken to obtain medical treatment, often to access lower cost, higher quality or more available care abroad.","Sustainable tourism":"Sustainable tourism seeks to minimise the negative environmental, social and economic impacts of travel while maximising benefits to host communities.","Tourism impacts":"Tourism impacts are the economic, social, cultural and environmental effects, both positive and negative, that tourism generates in a destination.","Tourism carrying capacity":"Tourism carrying capacity is the maximum number of visitors a destination can accommodate without unacceptable deterioration of the physical, economic or social environment.","Environmental perception":"Environmental perception is the way individuals or groups understand, interpret and respond to their surrounding environment, shaping how they use and value it.","Environmental adaptation":"Environmental adaptation refers to adjustments made by humans or ecosystems in response to changing environmental conditions.","Human modification of environments":"Human modification of environments refers to the alteration of natural landscapes and processes through activities such as agriculture, urbanisation and resource extraction.","Natural resource use":"Natural resource use refers to the ways societies extract, manage and consume materials and energy from the environment.","Environmental impacts":"Environmental impacts are the effects, whether beneficial or harmful, that human activities have on natural systems.","Sustainability":"Sustainability is the capacity to meet present needs without compromising the ability of future generations or ecosystems to meet their own needs.","Land degradation":"Land degradation is the long-term decline in the productive capacity of land due to processes such as erosion, salinization or deforestation.","Water pollution":"Water pollution is the contamination of water bodies by harmful substances, reducing their quality and usability for humans and ecosystems.","Air pollution":"Air pollution is the presence of harmful substances in the atmosphere at concentrations that can damage health, ecosystems or the climate.","Marine pollution":"Marine pollution is the introduction of harmful substances, including chemicals, plastics and nutrients, into ocean and coastal waters.","Plastic pollution":"Plastic pollution is the accumulation of plastic waste in the environment, particularly in oceans, where it harms marine life and ecosystems.","Biodiversity loss":"Biodiversity loss is the decline in the variety and abundance of species, genes and ecosystems, driven largely by habitat destruction, overexploitation, pollution and climate change.","Climate change":"Climate change refers to long-term shifts in temperature and weather patterns, which since the mid-20th century have been driven primarily by human greenhouse-gas emissions.","Habitat destruction":"Habitat destruction is the process by which a natural habitat is damaged or eliminated, no longer able to support the species that previously lived there.","Environmental impact assessment":"Environmental impact assessment is a formal process for evaluating the likely environmental consequences of a proposed project before it proceeds.","Environmental planning":"Environmental planning integrates environmental considerations into land-use and development decision-making.","Conservation":"Conservation is the protection, management and sustainable use of natural resources and ecosystems.","Restoration":"Ecological restoration is the process of assisting the recovery of a degraded or destroyed ecosystem.","Environmental policy":"Environmental policy comprises the laws, regulations and programmes governments use to manage and protect the environment.","Environmental governance":"Environmental governance refers to the institutions, rules and processes through which environmental decisions are made and implemented.","Ecosystem management":"Ecosystem management is an approach to managing natural resources that considers the entire ecosystem, including its ecological processes and interactions, rather than individual species or resources in isolation.","Earthquakes":"Earthquakes are sudden releases of energy in Earth's crust, generating seismic waves, most commonly caused by movement along faults at or near tectonic plate boundaries.","Volcanoes":"Volcanoes are openings in Earth's surface through which magma, gases and volcanic material erupt, typically forming characteristic cone or shield landforms.","Tsunamis":"Tsunamis are series of large ocean waves generated by the sudden displacement of a large volume of water, most commonly caused by undersea earthquakes.","Floods":"Floods are the overflow of water onto normally dry land, caused by factors such as intense rainfall, snowmelt, storm surge or dam failure.","Droughts":"Droughts are extended periods of below-average precipitation that result in water shortages affecting agriculture, ecosystems and human water supply.","Landslides":"Landslides are the downslope movement of rock, soil or debris under gravity, often triggered by heavy rainfall, earthquakes or slope undercutting.","Avalanches":"Avalanches are the rapid downslope movement of snow, ice and debris, typically triggered on steep slopes by additional loading or instability within the snowpack.","Cyclones":"Cyclones are large rotating storm systems characterised by low central pressure, including both mid-latitude cyclones and intense tropical cyclones.","Wildfires":"Wildfires are uncontrolled fires burning in vegetation such as forest, grassland or shrubland, which can be triggered naturally or by human activity.","Extreme temperatures":"Extreme temperatures refer to unusually high (heatwave) or low (cold wave) temperature events that pose risks to health, agriculture and infrastructure.","Exposure":"In disaster-risk terms, exposure refers to the people, property, systems or assets present in hazard-prone areas that are thereby subject to potential loss.","Disaster":"A disaster is a serious disruption to the functioning of a community or society, caused by a hazardous event interacting with vulnerability and exposure, resulting in widespread losses.","Prevention":"In disaster management, prevention refers to measures taken to avoid the occurrence of a hazard event or eliminate its potential to cause harm.","Preparedness":"Preparedness comprises the knowledge, capacities and plans developed by governments and communities to effectively anticipate, respond to and recover from disasters.","Response":"Disaster response encompasses the immediate actions taken during and after a hazard event to save lives, meet basic needs and reduce further harm.","Recovery":"Disaster recovery is the process of restoring and improving the lives, livelihoods and infrastructure of a disaster-affected community.","Reconstruction":"Reconstruction is the longer-term rebuilding of physical infrastructure and community systems following a disaster, ideally incorporating measures to reduce future risk.","Disaster risk reduction":"Disaster risk reduction is the systematic effort to analyse and manage the factors that cause disasters, including reducing exposure and vulnerability and improving preparedness.","Early-warning systems":"Early-warning systems are integrated systems for monitoring hazards and communicating timely alerts to enable people to take action to reduce risk before an event occurs.","Resilience":"Resilience is the ability of a system, community or individual to anticipate, absorb, adapt to and recover from a disturbance or shock.","Disease distribution":"Disease distribution describes the geographic pattern of where a disease occurs and at what frequency.","Disease mapping":"Disease mapping is the use of maps and spatial analysis to visualise and analyse the geographic distribution of disease incidence or prevalence.","Epidemiology":"Epidemiology is the study of the distribution and determinants of health-related states or events in populations, and the application of this knowledge to control health problems.","Health inequalities":"Health inequalities are systematic, avoidable differences in health outcomes between different population groups or geographic areas.","Healthcare accessibility":"Healthcare accessibility is the ease with which people can obtain needed medical services, shaped by distance, cost, transport and availability of facilities.","Healthcare facilities":"Healthcare facilities are institutions such as hospitals and clinics that provide medical services, whose geographic distribution affects access to care.","Environmental health":"Environmental health is the branch of public health concerned with how environmental factors, such as pollution and climate, affect human health.","Spatial epidemiology":"Spatial epidemiology is the study of the spatial distribution of disease and its determinants, using mapping and spatial statistical methods.","Infectious diseases":"Infectious diseases are illnesses caused by pathogenic organisms such as bacteria, viruses or parasites, capable of spreading between hosts.","Vector-borne diseases":"Vector-borne diseases are illnesses transmitted to humans by organisms such as mosquitoes or ticks, whose geographic range is often shaped by climate.","Water-borne dise
