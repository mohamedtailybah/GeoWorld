ases":"Water-borne diseases are illnesses caused by pathogens transmitted through contaminated water.","Non-communicable diseases":"Non-communicable diseases are illnesses that are not transmitted between people, such as heart disease, cancer and diabetes, often linked to lifestyle and environmental factors.","Disease diffusion":"Disease diffusion is the spatial spread of a disease from its point of origin outward through a population over time.","Disease hotspots":"Disease hotspots are geographic areas with an unusually high concentration of disease cases relative to surrounding areas.","Disease surveillance":"Disease surveillance is the ongoing, systematic collection and analysis of health data to monitor and detect disease outbreaks.","Public-health geography":"Public-health geography examines the spatial dimensions of health, disease and healthcare provision within populations.","Terrain analysis":"Terrain analysis is the evaluation of the physical characteristics of land, such as elevation, slope and vegetation, to assess its suitability for movement, defence or other purposes.","Strategic location":"A strategic location is a place whose geographic position confers military, economic or political advantage, such as control over a trade route or chokepoint.","Military mobility":"Military mobility refers to the capacity to move forces and equipment across terrain, shaped by infrastructure, topography and climate.","Buffer zones":"Buffer zones are neutral or demilitarised areas established between opposing forces or states to reduce the risk of conflict.","Chokepoints":"Chokepoints are narrow geographic passages, such as straits or canals, through which shipping or movement must pass, making them strategically significant.","Strategic waterways":"Strategic waterways are rivers, canals or straits of major economic or military importance for trade and naval movement.","Mountain passes":"Mountain passes are lower, navigable routes through mountain ranges, historically significant for trade, migration and military movement.","Military logistics":"Military logistics is the planning and execution of the movement and support of armed forces, including supply, transport and maintenance.","Geospatial intelligence":"Geospatial intelligence is the analysis of imagery and geospatial information to describe, assess and visually depict physical features and activities, typically for security or defence purposes.","North Africa":"North Africa is the region of Africa bordering the Mediterranean Sea, encompassing countries such as Morocco, Algeria, Tunisia, Libya and Egypt, largely characterised by the Sahara Desert and Atlas Mountains.","West Africa":"West Africa is the region of Africa along and near the Atlantic coast, encompassing countries such as Nigeria, Ghana and Senegal, spanning coastal rainforest to Sahelian savanna.","Central Africa":"Central Africa is the equatorial region of Africa encompassing countries such as the Democratic Republic of the Congo, Cameroon and Gabon, dominated by the Congo Basin rainforest.","East Africa":"East Africa is the region encompassing countries such as Kenya, Tanzania and Ethiopia, characterised by the Great Rift Valley, highland plateaus and savanna.","Southern Africa":"Southern Africa is the region encompassing countries such as South Africa, Botswana and Zimbabwe, ranging from Kalahari desert to temperate coastal zones.","East Asia":"East Asia is the region encompassing China, Japan, the Koreas, Mongolia and Taiwan, home to some of the world's largest economies and population centres.","Southeast Asia":"Southeast Asia is the region encompassing countries such as Indonesia, Thailand, Vietnam and the Philippines, characterised by tropical climate, extensive archipelagos and monsoon patterns.","South Asia":"South Asia is the region encompassing countries such as India, Pakistan and Bangladesh, dominated by the Indian subcontinent, the Himalayas and monsoon-driven climate.","Central Asia":"Central Asia is the landlocked region encompassing countries such as Kazakhstan, Uzbekistan and Turkmenistan, characterised by steppe, desert and mountain terrain.","West Asia":"West Asia, often called the Middle East, encompasses countries such as Saudi Arabia, Iran and Turkey, characterised by arid climate and significant oil resources.","Northern Europe":"Northern Europe encompasses the Scandinavian and Baltic countries and the British Isles, characterised by cool temperate to subarctic climates.","Western Europe":"Western Europe encompasses countries such as France, Germany and the Benelux states, characterised by temperate maritime climate and high economic development.","Southern Europe":"Southern Europe encompasses countries such as Spain, Italy and Greece bordering the Mediterranean Sea, characterised by a Mediterranean climate.","Eastern Europe":"Eastern Europe encompasses countries such as Poland, Ukraine and Romania, characterised by continental climate and extensive plains.","North America":"North America is the continent encompassing Canada, the United States and Mexico, spanning arctic tundra to tropical climates across a vast range of physical geography.","Central America":"Central America is the narrow isthmus connecting North and South America, encompassing countries such as Guatemala, Costa Rica and Panama.","Caribbean":"The Caribbean is the region of island states and territories in the Caribbean Sea, including Cuba, Jamaica and the Dominican Republic, characterised by tropical climate and vulnerability to hurricanes.","South America":"South America is the continent encompassing countries such as Brazil, Argentina and Colombia, home to the Amazon Basin, the Andes mountains and diverse climate zones.","Melanesia":"Melanesia is a subregion of Oceania encompassing Papua New Guinea, Fiji, the Solomon Islands and Vanuatu, characterised by predominantly dark-skinned Indigenous populations and volcanic island geography.","Micronesia":"Micronesia is a subregion of Oceania comprising small island states and territories such as the Marshall Islands, Palau and the Federated States of Micronesia in the western Pacific.","Polynesia":"Polynesia is a subregion of Oceania comprising island states and territories such as Samoa, Tonga and French Polynesia, spread across the central and eastern Pacific.","New Zealand":"New Zealand is an island country in the southwest Pacific, part of the Oceania region, characterised by mountainous terrain, temperate climate and geologically active landscapes.","Arctic":"The Arctic is the polar region surrounding the North Pole, encompassing the Arctic Ocean and northern parts of surrounding continents, characterised by sea ice, tundra and permafrost.","Antarctica":"Antarctica is the continent surrounding the South Pole, almost entirely covered by a thick ice sheet, governed under the Antarctic Treaty System and reserved primarily for scientific research.","Official name":"The official name is the formal, legally recognised name of a country, as used in international and constitutional contexts, which may differ from its common short-form name.","Major cities":"Major cities are the largest and most significant urban centres within a country by population, economic activity or administrative function.","Neighbouring countries":"Neighbouring countries are states that share a land border, or in some usages a close maritime boundary, with a given country.","Coastline":"A coastline is the boundary between land and sea, whose length and character (such as ria, fjord or barrier-island coast) shape a country's maritime access and vulnerability to coastal hazards.","Territorial waters":"Territorial waters are the belt of sea, extending up to 12 nautical miles from a coastal state's baseline, over which that state exercises sovereignty.","Major physical regions":"Major physical regions are the large-scale landform divisions — such as mountain ranges, plains and plateaus — that structure a country's physical geography.","Mountains":"Mountains are landforms of high relief rising prominently above surrounding terrain, formed by tectonic uplift, volcanism or erosion.","Biomes":"Biomes are large-scale ecological communities characterised by distinctive climate, vegetation and animal life, such as rainforest, desert or tundra.","Soils":"Soils are the natural, layered material covering much of Earth's land surface, formed from weathered rock and organic matter, and fundamental to agriculture and ecosystems.","Agriculture":"Agriculture is the cultivation of crops and raising of livestock for food, fibre and other products, forming a foundational economic activity for most countries.","Industries (country profile)":"Industries refers to the manufacturing and processing sectors of a country's economy, reflecting its resource base, labour force and level of development.","Energy (country profile)":"Energy, in a country profile, refers to the resources, infrastructure and mix of sources — fossil, renewable or nuclear — used to meet a country's power needs.","Transport (country profile)":"Transport, in a country profile, refers to the road, rail, air and maritime networks that move people and goods within and beyond a country's borders.","Languages":"Languages, in a country profile, refers to the official, national and widely spoken languages used within a country's population.","Religions":"Religions, in a country profile, refers to the major faith traditions practised within a country's population.","Ethnic/cultural groups":"Ethnic and cultural groups are populations within a country distinguished by shared ancestry, language, tradition or identity.","Economy":"An economy is the system of production, distribution and consumption of goods and services within a country or region.","Political geography (country profile)":"Political geography, in a country profile, describes a country's system of government, territorial organisation and international political relationships.","Administrative divisions":"Administrative divisions are the subnational units, such as states, provinces or districts, into which a country is organised for governance purposes.","Environmental problems":"Environmental problems are the significant natural or human-induced environmental challenges, such as pollution or deforestation, facing a place.","Natural hazards":"Natural hazards are potentially damaging natural events or processes, such as earthquakes, floods or cyclones, to which a place is exposed.","Protected areas (country profile)":"Protected areas, in a country profile, refers to the parks, reserves and other legally designated conservation zones within a country.","Major landmarks":"Major landmarks are notable natural or built features within a country recognised for their historical, cultural or scenic significance.","Historical geography (country profile)":"Historical geography, in a country profile, examines how a country's landscape, borders and settlement patterns have evolved over time.","Colonial history":"Colonial history refers to a country's past experience of foreign colonial rule, which often continues to shape its borders, institutions, languages and economy.","International relationships":"International relationships describe a country's diplomatic, economic and political ties with other states and international organisations.","Elevation":"Elevation is the height of a location above a reference level, usually mean sea level, influencing climate, accessibility and hazard exposure.","Urban boundary":"An urban boundary is the officially or functionally defined limit of a city's built-up or administrative area.","Metropolitan area":"A metropolitan area is a city together with its surrounding, economically integrated commuter zone.","Physical setting":"The physical setting of a city refers to its underlying terrain, hydrology and climate, which shape its layout, growth and hazard exposure.","Land use (city profile)":"Land use, in a city profile, describes how urban land is allocated among residential, commercial, industrial and other functions.","Transportation (city profile)":"Transportation, in a city profile, refers to the networks and modes that move people and goods within an urban area.","Infrastructure (city profile)":"Infrastructure, in a city profile, refers to the physical systems, such as utilities and roads, that support urban life.","Industry (city profile)":"Industry, in a city profile, refers to the manufacturing and production activities located within or near an urban area.","Commerce":"Commerce refers to the buying and selling of goods and services within a city's economy.","Governance (city profile)":"Governance, in a city profile, refers to the institutions and processes through which a city is administered and decisions are made.","Disaster risk (city profile)":"Disaster risk, in a city profile, refers to the potential for loss an urban area faces from natural or human-induced hazards.","Development (city profile)":"Development, in a city profile, refers to the trajectory of a city's economic, social and infrastructural growth.","Historical evolution":"Historical evolution, in a city profile, traces how a settlement's site, form and function have changed over time.","What is a map?":"A map is a graphic representation, usually at a reduced scale, of geographic space that communicates the location and characteristics of selected features.","Title":"A map title identifies the subject and, often, the area covered by a map, orienting the reader to its purpose.","Legend":"A map legend, or key, explains the meaning of the symbols, colours and patterns used on a map.","North arrow":"A north arrow is a map element indicating the direction of north, helping users orient the map relative to the real world.","Grid":"A map grid is a network of intersecting lines, typically representing coordinates, overlaid on a map to assist in locating features.","Symbols":"Map symbols are graphic marks representing real-world features on a map, standardised to convey information clearly and consistently.","Labels":"Map labels are text placed on a map to identify named features such as places, rivers or roads.","Colours":"Map colours are used systematically to differentiate features, represent quantitative values or convey categories of information.","Map layout":"Map layout is the overall arrangement of a map's elements — the mapped area, legend, title, scale and other components — for clarity and visual balance.","Physical maps":"Physical maps display natural features of the landscape, such as terrain, rivers and vegetation, typically using colour shading to show relief.","Political maps":"Political maps display human-defined boundaries such as countries, states and cities, without necessarily depicting terrain in detail.","Topographic maps":"Topographic maps show the shape and elevation of the land surface, typically using contour lines, along with other natural and human features.","Thematic maps":"Thematic maps focus on the spatial distribution of a single theme or variable, such as population density or rainfall, rather than showing general geographic features.","Geological maps":"Geological maps show the distribution of rock types, structures and geological ages across an area.","Climate maps":"Climate maps show the spatial distribution of climate variables or climate classification zones across an area.","Population maps":"Population maps display the distribution, density or characteristics of human population across an area.","Land-use maps":"Land-use maps show how land within an area is used, such as for agriculture, settlement or forest.","Soil maps":"Soil maps show the distribution of different soil types across an area.","Vegetation maps":"Vegetation maps show the distribution of plant communities and vegetation types across an area.","Cadastral maps":"Cadastral maps show the boundaries, dimensions and ownership of individual land parcels.","Navigation maps":"Navigation maps are designed specifically to assist route-finding and travel, whether by road, sea or air.","Choropleth maps":"Choropleth maps use shading or colour to represent a statistical variable, such as population density, aggregated by predefined areas such as countries or districts.","Dot maps":"Dot maps use individual dots to represent the presence or quantity of a phenomenon at specific locations.","Flow maps":"Flow maps use lines of varying width to represent the movement of people, goods or information between locations.","Cartograms":"Cartograms distort the size or shape of mapped areas to represent a statistical variable, such as population, rather than actual land area.","Isoline maps":"Isoline maps use lines connecting points of equal value, such as contour or isobar lines, to represent a continuous variable across space.","Transverse Mercator":"The Transverse Mercator projection is a cylindrical conformal projection oriented along a meridian rather than the Equator, minimising distortion in narrow north–south zones and widely used for national mapping systems.","Robinson":"The Robinson projection is a compromise, pseudocylindrical map projection that balances distortion of area, shape and distance to produce a visually pleasing world map.","Lambert Conformal Conic":"The Lambert Conformal Conic projection is a conic projection that preserves local shapes and angles, commonly used for mapping mid-latitude regions with an east–west extent, such as aviation charts.","Albers Equal Area":"The Albers Equal Area projection is a conic projection that preserves accurate area measurement across a map, at the cost of some shape distortion, commonly used for thematic maps of countries.","Azimuthal projections":"Azimuthal projections project the globe onto a flat plane, correctly preserving direction from a single central point.","Cylindrical projections":"Cylindrical projections project the globe onto a cylinder, producing a rectangular map with straight meridians and parallels.","Conic projections":"Conic projections project the globe onto a cone, well suited to mapping mid-latitude regions with an east–west extent.","Planar projections":"Planar, or azimuthal, projections project the globe directly onto a flat plane, typically centred on a pole or another chosen point.","Equal-area projections":"Equal-area projections preserve the relative sizes of areas across a map, at the expense of distorting shape.","Conformal projections":"Conformal projections preserve local angles and shapes across a map, at the expense of distorting area.","Equidistant projections":"Equidistant projections preserve accurate distances from one or two specific points or along certain lines, though not universally across the map.","Chain surveying":"Chain surveying is a traditional land-surveying method that measures distances directly using a chain or tape along a network of straight lines, suitable for small, relatively flat areas.","Compass surveying":"Compass surveying determines direction using a magnetic compass combined with measured distances to plot the position of features.","Plane table surveying":"Plane table surveying is a graphical field method in which a map is drawn directly in the field on a levelled board as measurements are taken.","Levelling":"Levelling is a surveying technique used to determine the difference in elevation between points, typically using an optical or digital level and a graduated staff.","Topographic surveying":"Topographic surveying measures and records the natural and constructed features and elevation of the land surface to produce detailed maps.","Engineering surveying":"Engineering surveying provides the precise measurements needed to plan, design and construct infrastructure such as roads, bridges and buildings.","Boundary surveying":"Boundary surveying establishes or re-establishes the precise legal limits of land parcels.","Hydrographic surveying":"Hydrographic surveying measures and maps the physical features of water bodies, such as depth and seabed topography, primarily for navigation safety.","Construction surveying":"Construction surveying sets out the precise positions and elevations required to guide the building of structures according to design plans.","Total station":"A total station is an electronic surveying instrument that combines an electronic theodolite with a distance-measuring device to determine angles and distances precisely.","Differential GPS":"Differential GPS improves the accuracy of standard GPS positioning by using correction signals from a fixed reference station with a known location.","Digital levels":"Digital levels are electronic surveying instruments that automatically read a barcoded levelling staff to determine height differences with high precision.","Laser scanning":"Laser scanning captures dense, precise three-dimensional point-cloud data of a surface or object using pulses of laser light.","LiDAR":"LiDAR (Light Detection and Ranging) is a remote-sensing technology that measures distance by timing laser pulses reflected off a surface, producing detailed elevation and structure data.","UAV/drone surveying":"UAV or drone surveying uses unmanned aerial vehicles equipped with cameras or sensors to capture imagery and data for mapping and analysis.","Ellipsoid":"A reference ellipsoid is a mathematically defined, smooth surface used to approximate Earth's shape as the basis for geodetic coordinate systems.","Coordinate reference systems":"Coordinate reference systems define how coordinates relate to actual positions on Earth's surface, specifying a datum, ellipsoid and projection where relevant.","Geodetic coordinates":"Geodetic coordinates express location as latitude, longitude and height relative to a defined reference ellipsoid.","Geodetic networks":"Geodetic networks are systems of precisely surveyed control points used to establish accurate reference coordinates over a region.","Positioning":"Positioning refers to the determination of the precise location of a point on or near Earth's surface using surveying or satellite techniques.","Reference frames":"Reference frames are the practical, physically realised coordinate systems, tied to a set of observed points, that implement a geodetic datum.","GIS concepts":"GIS concepts encompass the fundamental ideas underlying Geographic Information Systems, including spatial data models, coordinate systems, layers and spatial relationships.","Spatial data":"Spatial data is information that includes a geographic location component, allowing it to be mapped and analysed in relation to other spatial data.","Attribute data":"Attribute data is the non-spatial descriptive information associated with a geographic feature, such as its name, type or population.","Points":"In GIS, points are zero-dimensional spatial features representing discrete locations, such as a well or a city.","Lines":"In GIS, lines are one-dimensional spatial features representing linear phenomena, such as roads or rivers.","Polygons":"In GIS, polygons are two-dimensional spatial features representing areas, such as countries, lakes or land parcels.","Layers":"In GIS, layers are individual sets of related spatial data — such as roads, land use or elevation — that can be viewed and analysed together or separately.","Geodatabases":"Geodatabases are structured collections of spatial and attribute data, stored and managed within a GIS.","Coordinate systems":"Coordinate systems provide the framework of reference values used to define the position of features in space.","Spatial queries":"Spatial queries are database operations that select or retrieve features based on their geographic location or relationship to other features.","Spatial analysis":"Spatial analysis is the process of examining the locations, attributes and relationships of features to identify patterns and relationships.","Network analysis":"Network analysis examines connectivity and flow within linear networks, such as roads or utilities, to solve problems like shortest-path routing or service-area delineation.","Terrain analysis (GIS)":"Terrain analysis in GIS derives information such as slope, aspect and viewsheds from elevation data.","Geoprocessing":"Geoprocessing is the execution of a sequence of operations on spatial data within a GIS to derive new datasets or information.","Intersect":"In GIS overlay analysis, intersect creates a new dataset containing only the areas where two or more input layers spatially overlap.","Union":"In GIS overlay analysis, union combines two or more input layers, retaining all features and their combined attributes across the full extent of both.","Clip":"In GIS, clip extracts the portion of one dataset that falls within the boundary of another dataset.","Dissolve":"In GIS, dissolve merges adjacent polygons that share a common attribute value into a single combined feature.","Proximity analysis":"Proximity analysis examines the spatial relationship between features based on distance, such as identifying what falls within a given radius of a point.","Density analysis":"Density analysis calculates the concentration of points or values per unit area across a surface.","Suitability analysis":"Suitability analysis combines multiple spatial criteria to identify locations best suited for a particular use, such as a new facility site.","Site selection":"Site selection is the process of identifying the optimal location for a facility or activity based on relevant spatial criteria.","Multi-criteria decision analysis":"Multi-criteria decision analysis is a method for evaluating and ranking options against multiple, often competing, criteria, frequently applied to spatial site-selection or planning problems.","Sensors":"Sensors are instruments that detect and record electromagnetic radiation or other signals from a target, forming the core data-collection component of remote-sensing systems.","Satellites":"Satellites are objects placed in orbit around Earth, carrying instruments used for tasks including remote sensing, communication and positioning.","Aerial photography":"Aerial photography is the capture of photographic images of the ground from an aircraft or other airborne platform.","Passive sensors":"Passive sensors detect naturally occurring radiation, typically reflected sunlight or emitted thermal energy, from a target.","Active sensors":"Active sensors emit their own energy, such as radar or laser pulses, toward a target and measure the signal that is reflected back.","Optical imagery":"Optical imagery captures visible and near-infrared light reflected from Earth's surface, similar to what the human eye or a standard camera perceives.","Radar":"Radar (Radio Detection and Ranging) is an active remote-sensing technology that transmits microwave pulses and measures their reflection to determine distance and surface characteristics, functioning day or night and through cloud cover.","Multispectral imagery":"Multispectral imagery captures data across several distinct, relatively broad wavelength bands, allowing differentiation of surface materials not visible to the naked eye.","Hyperspectral imagery":"Hyperspectral imagery captures data across hundreds of narrow, contiguous wavelength bands, enabling detailed identification of surface materials based on their spectral signature.","Thermal imagery":"Thermal imagery detects emitted infrared radiation to map surface temperature variations.","Land-cover mapping":"Land-cover mapping uses remote-sensing imagery to classify and map the physical material — such as forest, water or built-up area — covering the land surface.","Land-use mapping":"Land-use mapping documents how land is functionally used by people, such as for agriculture, residential or industrial purposes, often derived from remote-sensing data combined with other sources.","Forestry (remote sensing)":"Remote sensing supports forestry by mapping forest extent, monitoring deforestation, and assessing tree health, biomass and species composition.","Urban mapping":"Urban mapping uses remote sensing and GIS to document and monitor the extent, growth and structure of built-up areas.","Water resources (remote sensing)":"Remote sensing supports water-resource assessment by mapping surface water extent, monitoring reservoir levels and estimating snow cover and soil moisture.","Disaster monitoring":"Disaster monitoring uses remote sensing to detect, track and assess the impact of hazard events such as floods, wildfires and earthquakes.","Climate monitoring":"Climate monitoring uses satellite and ground-based observations to track long-term changes in temperature, sea level, ice cover and other climate indicators.","Coastal monitoring":"Coastal monitoring uses remote sensing to track shoreline change, erosion and coastal ecosystem health over time.","Environmental monitoring (remote sensing)":"Environmental monitoring uses satellite and airborne sensors to track changes in ecosystems, pollution and natural resources over time.","Change detection":"Change detection is the process of identifying differences in the state of a feature or area by comparing remote-sensing imagery from two or more dates.","GLONASS":"GLONASS is Russia's Global Navigation Satellite System, providing positioning, navigation and timing services comparable to GPS.","Galileo":"Galileo is the European Union's Global Navigation Satellite System, designed to provide independent, high-precision positioning services.","BeiDou":"BeiDou is China's Global Navigation Satellite System, providing global positioning, navigation and timing services.","QZSS":"QZSS (Quasi-Zenith Satellite System) is Japan's regional satellite positioning system, designed to augment GPS accuracy over Japan and the Asia-Oceania region.","NavIC":"NavIC is India's regional navigation satellite system, providing positioning services over India and the surrounding region.","GNSS positioning":"GNSS positioning is the determination of a receiver's location by measuring signals from multiple satellites within a Global Navigation Satellite System.","Static surveying":"Static GNSS surveying involves collecting satellite observations at a fixed point over an extended period to achieve very high positional accuracy.","PPK":"Post-Processed Kinematic (PPK) positioning records raw GNSS data in the field and applies correction data afterward to achieve high-precision coordinates.","Differential positioning":"Differential positioning improves GNSS accuracy by using correction data from one or more reference stations with known coordinates.","Coordinate transformation":"Coordinate transformation converts spatial data from one coordinate reference system or datum to another.","Aerial photography (photogrammetry)":"In photogrammetry, aerial photography provides the overlapping images from which measurements and 3D models of the ground surface are derived.","Stereo imagery":"Stereo imagery consists of two overlapping photographs of the same area taken from different positions, allowing three-dimensional terrain to be perceived and measured.","Ground control points":"Ground control points are precisely surveyed locations visible in imagery, used to accurately georeference and calibrate photogrammetric or remote-sensing products.","Orthophotos":"Orthophotos are aerial photographs that have been geometrically corrected so that they have a uniform, map-accurate scale throughout.","Point clouds":"Point clouds are large sets of 3D coordinate measurements representing the surface of an object or landscape, typically generated by LiDAR or photogrammetry.","3D reconstruction":"3D reconstruction is the process of generating a three-dimensional digital model of an object or landscape from photographs or scan data.","Structure from Motion":"Structure from Motion is a photogrammetric technique that reconstructs 3D structure from a series of overlapping 2D images taken from different viewpoints.","UAV photogrammetry":"UAV photogrammetry uses images captured by drones to generate accurate 3D models, orthophotos and elevation data.","3D GIS":"3D GIS extends conventional GIS to represent, analyse and visualise geographic features with height and volume, not just their two-dimensional footprint.","3D city models":"3D city models are digital representations of urban areas that include the height and geometry of buildings and other structures.","Terrain modelling":"Terrain modelling is the creation of digital representations of land-surface elevation and shape, used for analysis and visualisation.","Point-cloud analysis":"Point-cloud analysis processes dense 3D point data, such as from LiDAR, to extract features, measurements or classifications of the scanned surface.","Virtual globes":"Virtual globes are interactive 3D digital representations of Earth that allow users to explore geographic data draped over a globe or terrain model.","3D visualization":"3D visualisation is the graphical rendering of spatial data in three dimensions to aid interpretation, analysis and communication.","Spatial databases":"Spatial databases are databases optimised to store, query and manage geographic data alongside its associated attributes.","Metadata":"Metadata is structured information describing a dataset's content, source, quality, format and lineage, helping users assess its fitness for use.","Data quality":"Data quality refers to the accuracy, completeness, consistency and reliability of a dataset for its intended use.","Data standards":"Data standards are agreed specifications for how data should be structured, formatted and documented to ensure consistency and interoperability.","Spatial data infrastructures":"Spatial data infrastructures are the policies, standards, technologies and institutional arrangements that facilitate the discovery, access and sharing of geospatial data.","Open geospatial data":"Open geospatial data is spatial data made freely available for anyone to access, use and share, often published by governments or research institutions.","Reverse geocoding":"Reverse geocoding converts geographic coordinates into a human-readable address or place description.","Spatial APIs":"Spatial APIs are programming interfaces that allow software to request, retrieve or process geographic data and services.","Geary's C":"Geary's C is a statistic used to measure spatial autocorrelation, complementing Moran's I by being more sensitive to local variation between neighbouring values.","Hotspot analysis":"Hotspot analysis identifies statistically significant spatial clusters of high or low values within a dataset.","Cluster analysis":"Cluster analysis groups data points based on similarity, which in a spatial context often reflects geographic proximity or shared attributes.","Point-pattern analysis":"Point-pattern analysis examines the spatial arrangement of point features to determine whether they are clustered, dispersed or randomly distributed.","Regression":"Regression analysis models the statistical relationship between a dependent variable and one or more independent variables, used in geography to explain spatial patterns.","Geographically weighted regression":"Geographically weighted regression is a spatial statistical technique that allows relationships between variables to vary across different locations, rather than assuming a single relationship holds everywhere.","Python":"Python is a widely used programming language favoured in geospatial work for its readability and extensive libraries for data analysis, GIS and automation.","R":"R is a programming language and environment particularly popular for statistical computing and spatial data analysis.","SQL":"SQL (Structured Query Language) is a programming language used to query and manage data held in relational databases, including spatial databases.","JavaScript":"JavaScript is a programming language widely used to build interactive web maps and geospatial applications.","APIs":"APIs (Application Programming Interfaces) are defined sets of rules that allow different software systems, including geospatial platforms, to communicate and exchange data.","Automation":"In geospatial work, automation refers to the use of scripts or tools to perform repetitive data-processing or analysis tasks without manual intervention.","GIS scripting":"GIS scripting uses programming languages to automate, customise or extend the functionality of a Geographic Information System.","Geoprocessing models":"Geoprocessing models are predefined or user-built workflows that chain together a sequence of spatial-analysis operations.","Web GIS":"Web GIS delivers geographic information system functionality, such as mapping and spatial analysis, through web-based platforms accessible via a browser.","Machine learning":"Machine learning is a branch of artificial intelligence in which algorithms learn patterns from data to make predictions or classifications, increasingly applied to geospatial tasks such as land-cover classification.","Deep learning":"Deep learning is a subset of machine learning using multi-layered neural networks, increasingly applied to complex geospatial tasks such as image recognition and feature extraction.","Computer vision":"Computer vision is a field of artificial intelligence focused on enabling computers to interpret and understand visual information, including satellite and aerial imagery.","Image classification":"Image classification is the process of categorising pixels or objects within an image into predefined classes, such as land-cover types.","Object detection":"Object detection is a computer-vision task that identifies and locates specific objects, such as buildings or vehicles, within an image.","Predictive spatial modelling":"Predictive spatial modelling uses statistical or machine-learning methods to forecast where a phenomenon is likely to occur based on spatial patterns and relationships.","AI-assisted mapping":"AI-assisted mapping uses artificial-intelligence techniques to automate or enhance the process of creating and updating maps from imagery and other data.","Automated feature extraction":"Automated feature extraction uses algorithms to automatically identify and delineate geographic features, such as roads or buildings, from imagery.","Large geospatial datasets":"Large geospatial datasets are extensive collections of spatial data, often generated by satellites or sensor networks, that require specialised storage, processing and analysis methods.","Residential land":"Residential land is land designated or used primarily for housing.","Commercial land":"Commercial land is land designated or used primarily for retail, office and other business activity.","Industrial land":"Industrial land is land designated or used primarily for manufacturing, processing and warehousing activity.","Agricultural land":"Agricultural land is land used for crop cultivation or livestock production.","Forest land":"Forest land is land covered predominantly by trees, whether natural or planted.","Mining land":"Mining land is land used for the extraction of minerals, ores or other geological materials.","Conservation land":"Conservation land is land designated to protect natural habitats, biodiversity or landscapes from development.","Transport corridors":"Transport corridors are linear strips of land occupied by roads, railways or other transport infrastructure.","Institutional land":"Institutional land is land occupied by public or civic institutions such as schools, hospitals and government buildings.","Forest (land cover)":"As a land-cover class, forest refers to land dominated by tree canopy cover above a defined density threshold.","Grassland":"As a land-cover class, grassland refers to land dominated by grasses and herbaceous vegetation, with few or no trees.","Cropland":"As a land-cover class, cropland refers to land under cultivation for annual or perennial crops.","Built-up areas":"As a land-cover class, built-up areas refer to land covered by buildings, roads and other constructed infrastructure.","Bare land":"As a land-cover class, bare land refers to land with little or no vegetation cover, such as rock, sand or bare soil.","Water bodies":"As a land-cover class, water bodies refer to areas covered by lakes, rivers, reservoirs or the sea.","Shrubland":"As a land-cover class, shrubland refers to land dominated by woody shrub vegetation, typically shorter and denser than forest.","Cadastral systems":"Cadastral systems are official records and maps documenting the ownership, boundaries and value of land parcels within a jurisdiction.","Land ownership":"Land ownership refers to the legal rights held by an individual, group or institution over a parcel of land.","Property boundaries":"Property boundaries are the legally defined limits of a land parcel, distinguishing it from adjoining properties.","Land registration":"Land registration is the official recording of land ownership and interests in a public register, providing legal certainty of title.","Land valuation":"Land valuation is the process of estimating the monetary worth of a parcel of land, used for taxation, sale or planning purposes.","Land-use planning":"Land-use planning is the process of regulating and guiding how land within a jurisdiction is developed and used, balancing competing needs.","Land disputes":"Land disputes are conflicts over the ownership, boundaries or use of land between individuals, communities or states.","Spatial planning":"Spatial planning is the coordinated, forward-looking process of organising land use and development across a territory to achieve social, economic and environmental goals.","Marine ecosystems (marine geography)":"Marine ecosystems are the interdependent communities of organisms and their physical environment found in oceans and seas.","Coastal ecosystems":"Coastal ecosystems are the ecological communities found at the land–sea interface, including mangroves, salt marshes, dunes and coral reefs.","Marine resources":"Marine resources are economically valuable materials and organisms found in the ocean, including fish, minerals and energy resources.","Ocean pollution":"Ocean pollution is the introduction of harmful substances, including plastics, chemicals and excess nutrients, into marine waters.","Seagrass":"Seagrass consists of flowering plants that grow in shallow marine and estuarine waters, forming productive underwater meadows important for marine biodiversity and carbon storage.","Marine protected areas":"Marine protected areas are designated ocean zones managed to conserve marine ecosystems and biodiversity, often with restrictions on fishing and other extractive activity.","Contiguous zone":"The contiguous zone extends up to 24 nautical miles from a coastal state's baseline, within which the state may enforce customs, fiscal, immigration and sanitary laws.","Continental shelf":"The continental shelf is the gently sloping, submerged extension of a continent's landmass, over which the coastal state has rights to seabed resources.","International waters":"International waters, or the high seas, are ocean areas beyond any state's national jurisdiction, open to all states subject to international law.","Shipping routes":"Shipping routes are established sea lanes used by maritime vessels for the efficient and safe transport of goods and passengers.","Ports (maritime geography)":"Ports are coastal or riverine facilities where ships load and unload cargo or passengers, serving as critical nodes in global trade networks.","Ocean geopolitics":"Ocean geopolitics examines how control over maritime zones, resources and shipping routes shapes relations and rivalry between states.","Ancient landscapes":"Ancient landscapes are landscapes reconstructed or studied as they existed in early historical or prehistoric periods.","Historical settlements":"Historical settlements are past human communities studied through archaeological, cartographic or documentary evidence to understand earlier patterns of settlement.","Colonial geography":"Colonial geography studies the spatial patterns, administration and landscapes produced by colonial rule.","Historical borders":"Historical borders are political boundaries as they existed at earlier points in time, which may differ from current borders.","Historical land use":"Historical land use refers to how land was used by people in the past, reconstructed from maps, records and other evidence.","Population changes":"Population changes refer to shifts in the size, distribution or composition of a population over time.","Migration history":"Migration history examines patterns of human movement across space in the past and their lasting geographic legacies.","Historical maps":"Historical maps are maps produced in the past, used today as evidence of earlier geographic knowledge, boundaries and land use.","Changing political territories":"Changing political territories refers to the shifting boundaries and control of states and regions over time due to conquest, treaty or political change.","Landscape evolution":"Landscape evolution is the long-term transformation of the physical or cultural landscape through natural processes and human activity.","Spatial change":"Spatial change refers to the transformation of the geographic pattern of a phenomenon over time.","Temporal change":"Temporal change refers to how a phenomenon or place varies or evolves over time.","Land-use change":"Land-use change refers to the conversion of land from one use, such as forest, to another, such as agriculture or urban development.","Climate change through time":"Climate change through time refers to the study of how Earth's climate has varied across geological and historical timescales, including both natural cycles and recent anthropogenic change.","Historical GIS":"Historical GIS applies Geographic Information Systems methods to analyse and visualise historical spatial data, such as past boundaries or land use.","Time-series remote sensing":"Time-series remote sensing uses repeated satellite or aerial observations over time to detect and analyse change in a landscape or feature.","Humans and climate":"This theme examines the two-way relationship between human societies and climate, including how climate shapes settlement and livelihoods and how human activity alters climate.","Humans and water":"This theme examines how human societies depend on, manage and alter water resources, and how water availability shapes human settlement and activity.","Humans and soils":"This theme examines how human land-use practices affect soil health and how soil quality shapes agricultural and settlement patterns.","Humans and forests":"This theme examines the reciprocal relationship between human societies and forests, including resource use, deforestation and forest-dependent livelihoods.","Humans and oceans":"This theme examines how human societies use, depend on and impact ocean ecosystems and resources.","Humans and biodiversity":"This theme examines how human activity affects biodiversity and how biodiversity in turn supports human well-being and livelihoods.","Agriculture–environment interaction":"Agriculture–environment interaction examines the two-way relationship between farming systems and the natural environment, including both dependence on natural resources and environmental impacts of farming.","Urban–environment interaction":"Urban–environment interaction examines the reciprocal relationship between cities and their surrounding natural environment.","Resource–society relationships":"Resource–society relationships examine how societies access, use, manage and depend on natural resources.","Social–ecological systems":"Social–ecological systems are integrated systems in which human and natural components are closely linked and interact dynamically.","Environmental feedback":"Environmental feedback refers to processes by which changes in an environmental system reinforce (positive feedback) or dampen (negative feedback) further change.","Resource sustainability":"Resource sustainability refers to the capacity to use natural resources at a rate that does not deplete or degrade them for future use.","Adaptation":"Adaptation is the adjustment of natural or human systems in response to actual or expected environmental change, aiming to moderate harm or exploit beneficial opportunities.","Environmental governance (integration)":"Environmental governance refers to the institutions and processes through which societies manage their relationship with the environment.","Regional planning":"Regional planning coordinates land use, infrastructure and development across a large area spanning multiple local jurisdictions.","Urban planning":"Urban planning is the process of designing and regulating the use of land and infrastructure within a city to guide its orderly development.","Rural planning":"Rural planning guides land use and development in non-urban areas, balancing agriculture, conservation and settlement needs.","Infrastructure planning":"Infrastructure planning coordinates the development of physical systems such as transport, energy and water networks to meet future needs.","Transportation planning":"Transportation planning is the process of designing and managing transport networks and services to meet current and future mobility needs.","Environmental planning (applied)":"Environmental planning integrates environmental considerations into decisions about land use and development.","Hazard mapping":"Hazard mapping identifies and delineates areas exposed to specific natural hazards, such as flooding or landslides.","Vulnerability mapping":"Vulnerability mapping identifies and delineates populations or areas most susceptible to harm from a hazard.","Risk mapping":"Risk mapping combines hazard, exposure and vulnerability information to show the spatial distribution of potential disaster loss.","Evacuation planning":"Evacuation planning designs the routes, procedures and resources needed to move people safely away from a hazard area.","Emergency logistics":"Emergency logistics is the planning and coordination of resources, supplies and personnel needed to respond effectively to a disaster.","Crop mapping":"Crop mapping uses remote sensing and field data to identify and map the type and extent of crops grown across an area.","Yield estimation":"Yield estimation uses field, satellite or model-based data to forecast agricultural production before or during harvest.","Precision agriculture":"Precision agriculture uses geospatial data, sensors and technology to manage farm inputs and practices at a fine spatial scale, optimising yield and resource use.","Soil mapping":"Soil mapping documents the spatial distribution of soil types and properties across an area.","Irrigation planning":"Irrigation planning designs and manages water-delivery systems to meet crop water needs efficiently.","Agricultural suitability":"Agricultural suitability assessment evaluates how well a given area's soil, climate and terrain support a particular crop or farming system.","Drought monitoring":"Drought monitoring tracks indicators such as rainfall, soil moisture and vegetation health to detect and assess the severity of drought conditions.","Environmental monitoring (applied)":"Environmental monitoring is the ongoing observation and measurement of environmental conditions to detect change and inform management.","Conservation planning (applied)":"Conservation planning identifies priority areas and actions to protect biodiversity and natural resources most effectively.","Pollution mapping":"Pollution mapping documents the spatial distribution and concentration of pollutants across an area.","Deforestation monitoring":"Deforestation monitoring uses remote sensing to detect and track the loss of forest cover over time.","Climate vulnerability mapping":"Climate vulnerability mapping identifies areas and populations most susceptible to the adverse effects of climate change.","Ecosystem assessment":"Ecosystem assessment evaluates the condition, health and services provided by an ecosystem.","Cognitive Geography":"Cognitive geography studies how people perceive, understand and mentally represent geographic space, including the formation of mental maps.","Marxist Geography":"Marxist geography applies Marxist political-economic theory to explain spatial inequality and the production of space under capitalism.","Political Ecology":"Political ecology examines how political, economic and social power relations shape environmental change and access to natural resources.","Cultural Ecology":"Cultural ecology studies how human cultures adapt to, and are shaped by, their natural environment.","Environmental Justice Geography":"Environmental justice geography examines the unequal distribution of environmental burdens and benefits across different social and racial groups and places.","Children's Geography":"Children's geography examines children's experiences, use and perception of space and place.","Gender Geography":"Gender geography examines how gender shapes, and is shaped by, spatial relations, access to resources and experiences of place.","Medical Geography":"Medical geography, closely related to health geography, studies the spatial patterns of disease and healthcare.","Industrial Geography":"Industrial geography studies the location, organisation and spatial patterns of manufacturing and industrial activity.","Rural Geography":"Rural geography studies the economic, social and environmental characteristics of non-urban areas.","Coastal Geography":"Coastal geography studies the physical processes and human activities occurring at the interface between land and sea.","Island Geography":"Island geography studies the distinctive physical, ecological and human characteristics of island environments.","Mountain Geography":"Mountain geography studies the physical processes and human activities distinctive to high-relief mountain environments.","Desert Geography":"Desert geography studies the physical processes, ecosystems and human adaptations characteristic of arid environments.","Polar Geography":"Polar geography studies the physical processes, ecosystems and human activity in the Arctic and Antarctic regions.","Tropical Geography":"Tropical geography studies the distinctive physical processes, ecosystems and human activities of the tropics.","Behavioural GIS":"Behavioural GIS integrates behavioural-geography concepts, such as perception and decision-making, into GIS-based analysis.","Cyber Geography":"Cyber geography studies the spatial patterns and infrastructure of digital networks and online activity.","Digital Geography":"Digital geography studies how digital technologies reshape spatial practices, infrastructure and the production of geographic knowledge.","Internet Geography":"Internet geography examines the physical infrastructure and uneven spatial distribution of internet access and usage.","Geospatial Intelligence (specialized)":"Geospatial intelligence combines imagery, mapping and spatial analysis to support decision-making, particularly in security and defence contexts.","Field observation":"Field observation is the systematic recording of phenomena directly at their location, a foundational method of geographic fieldwork.","Field notes":"Field notes are written records made during fieldwork documenting observations, measurements and reflections.","Interviews":"Interviews are a qualitative research method involving structured or open conversation with individuals to gather information or perspectives.","Questionnaires":"Questionnaires are structured sets of written questions used to collect standardised data from a sample of respondents.","Focus groups":"Focus groups are a qualitative research method in which a small group discusses a topic under guided facilitation to gather diverse perspectives.","GPS data collection":"GPS data collection uses satellite positioning devices to record precise locations of features or observations during fieldwork.","Transects":"A transect is a line or narrow strip along which observations or measurements are systematically recorded to sample variation across a landscape.","Land-use surveys":"Land-use surveys systematically record how land within an area is being used.","Soil sampling":"Soil sampling involves collecting soil specimens from the field for laboratory analysis of properties such as texture, fertility and contamination.","Water sampling":"Water sampling involves collecting water specimens from the field for laboratory analysis of quality and composition.","Environmental assessment":"Environmental assessment evaluates the condition of an environment or the likely impact of a proposed activity upon it.","Household surveys":"Household surveys collect data from a sample of households, commonly used to gather socioeconomic and demographic information.","Participatory mapping":"Participatory mapping involves local communities directly in the creation of maps that represent their own knowledge, land use and priorities.","Research questions":"Research questions are the specific questions a study is designed to answer, guiding its methodology and analysis.","Hypotheses":"A hypothesis is a testable proposed explanation for a phenomenon, formulated prior to data collection and analysis.","Literature review":"A literature review is a critical summary and synthesis of existing research relevant to a study's topic.","Qualitative methods":"Qualitative methods gather and analyse non-numerical data, such as interviews or observations, to understand meaning, experience and context.","Quantitative methods":"Quantitative methods gather and statistically analyse numerical data to identify patterns and test relationships.","Sampling":"Sampling is the process of selecting a representative subset of a population or area for study, in place of studying the whole.","Data collection":"Data collection is the systematic gathering of information relevant to a research question, using methods such as surveys, sensors or fieldwork.","Data analysis":"Data analysis is the process of inspecting, processing and interpreting data to draw conclusions and support decision-making.","Statistical analysis":"Statistical analysis applies mathematical techniques to data to identify patterns, test hypotheses and quantify uncertainty.","Research ethics":"Research ethics comprises the principles guiding responsible conduct in research, including informed consent, confidentiality and minimising harm to participants.","Academic writing":"Academic writing is the formal, structured communication of research findings and arguments to a scholarly audience.","Cartographic presentation":"Cartographic presentation is the effective visual communication of research findings through well-designed maps.","Research dissemination":"Research dissemination is the process of sharing research findings with relevant audiences, such as through publications, presentations or public communication.","Area":"Area is the measure of the extent of a two-dimensional surface, expressed in units such as square kilometres or hectares.","Perimeter":"Perimeter is the total length of the boundary enclosing a two-dimensional shape or area.","Aspect":"Aspect is the compass direction that a slope faces, which influences the amount of solar radiation it receives and, in turn, local temperature, vegetation and snowmelt.","Gradient":"Gradient is the rate of change of a variable, such as elevation, temperature or pressure, over distance.","Density":"In geography, density is the concentration of a phenomenon, such as population, per unit of area.","Ratios":"Ratios express the relative size of one quantity compared to another, used in geography for measures such as dependency ratios or sex ratios.","Proportions":"Proportions express a part of a whole as a fraction or percentage, used widely in geographic statistical description.","Spatial statistics (measurement)":"Spatial statistics comprises quantitative methods designed specifically to analyse data with a geographic location component.","Cartographic design":"Cartographic design is the deliberate process of arranging a map's visual elements to communicate spatial information clearly and effectively.","Symbolization":"Symbolization is the process of representing geographic features using visual symbols, chosen to reflect the nature and importance of the data.","Generalization":"Cartographic generalization is the process of simplifying map detail to suit its scale and purpose, retaining essential information while removing unnecessary complexity.","Classification":"Classification is the process of grouping data into categories, such as ranges of value, for effective representation on a map.","Visual hierarchy":"Visual hierarchy is the deliberate arrangement of map elements by visual weight, so that the most important information stands out first.","Colour theory":"Colour theory in cartography guides the selection of colours to effectively represent data, ensure legibility and convey meaning.","Typography":"Typography in cartography refers to the choice, size and placement of text and labels for clarity and visual balance.","Map projections (visualization)":"Map projections are mathematical methods for representing the curved surface of Earth on a flat map, each involving some trade-off between preserving shape, area, distance or direction.","Thematic mapping":"Thematic mapping is the creation of maps that portray the spatial pattern of a specific theme or variable, such as income or rainfall.","Interactive maps":"Interactive maps allow users to explore spatial data dynamically, such as by zooming, panning or querying features.","Web mapping":"Web mapping delivers interactive maps and geographic data through internet browsers.","Story maps":"Story maps combine narrative text, images and interactive maps to communicate a geographic story or analysis.","3D maps":"3D maps represent geographic features with height or volume, providing a more realistic depiction of terrain and structures.","Animated maps":"Animated maps use a sequence of frames to show how a geographic phenomenon changes over time.","Dashboard mapping":"Dashboard mapping combines maps with charts and summary statistics on a single interface for monitoring and decision-making.","Online mapping":"Online mapping refers to web-based platforms and services that provide maps and geographic data over the internet.","Cloud GIS":"Cloud GIS delivers geographic information system storage, processing and analysis capability via cloud computing infrastructure.","Mobile GIS":"Mobile GIS enables the collection, viewing and analysis of geographic data using smartphones or other portable devices in the field.","Real-time GIS":"Real-time GIS integrates continuously updating data streams, such as sensor or vehicle-location feeds, into a GIS for immediate analysis and display.","Location intelligence":"Location intelligence is the derivation of meaningful insight from the analysis of geospatial data to support business or operational decisions.","Spatial dashboards":"Spatial dashboards present maps alongside key metrics and charts on a single interface for real-time monitoring.","Smart cities (technology)":"Smart cities use digital sensors, data and connected infrastructure to improve the efficiency and responsiveness of urban services.","IoT and geography":"The Internet of Things (IoT) in geography refers to networks of location-aware sensors and connected devices that generate real-time spatial data.","Sensor networks":"Sensor networks are interconnected devices that collect and transmit data, including location-based environmental or infrastructure data.","Geospatial big data":"Geospatial big data refers to very large, often continuously generated volumes of location-based data requiring specialised methods for storage, processing and analysis.","Global economic networks":"Global economic networks are the interconnected flows of trade, investment and production that link firms, markets and countries worldwide.","Global trade":"Global trade is the exchange of goods and services across international borders.","Global migration":"Global migration refers to the worldwide patterns and flows of people moving between countries.","Global cities":"Global cities are major urban centres that serve as key nodes in the global economy, concentrating finance, corporate headquarters and international connectivity.","Global production":"Global production refers to the organisation of manufacturing and services across multiple countries, often through global value chains.","Global supply chains":"Global supply chains are the international networks of production, processing and distribution through which goods move from raw material to final consumer.","Digital globalization":"Digital globalization is the increasing worldwide interconnection enabled by digital technology, data flows and online communication.","Environmental globalization":"Environmental globalization refers to the increasingly global scale of environmental processes, impacts and governance, such as climate change and international environmental agreements.","Global climate system":"The global climate system is the interconnected set of atmospheric, oceanic, terrestrial and cryospheric processes that together determine Earth's long-term weather patterns.","Water cycle":"The water cycle, or hydrological cycle, is the continuous movement of water between the atmosphere, land and oceans through evaporation, condensation, precipitation and runoff.","Nitrogen cycle":"The nitrogen cycle is the continuous movement of nitrogen between the atmosphere, soil, water and living organisms through processes such as fixation, nitrification and denitrification.","Energy balance":"Earth's energy balance is the equilibrium between incoming solar radiation and outgoing radiation from Earth, which determines global temperature.","Ocean circulation":"Ocean circulation is the large-scale movement of seawater driven by wind, temperature and salinity differences, redistributing heat around the planet.","Biodiversity system":"The biodiversity system refers to the interconnected web of genetic, species and ecosystem diversity across the planet and the processes that sustain it.","Earth-system science":"Earth-system science studies Earth as an integrated system of interacting atmospheric, oceanic, terrestrial, biological and human components.","Autonomous mapping":"Autonomous mapping uses self-operating vehicles or systems, such as drones or robots, to collect data and generate maps with minimal human intervention.","Digital Earth":"Digital Earth is the concept of a comprehensive, multi-resolution, three-dimensional digital representation of the planet, integrating diverse geospatial data.","Smart agriculture":"Smart agriculture uses sensors, data analytics and automation to optimise farming decisions and resource use.","Climate intelligence":"Climate intelligence refers to the use of data and analytics to understand and anticipate climate risks and inform decision-making.","Predictive geography":"Predictive geography uses spatial data and modelling to forecast future geographic patterns, such as urban growth or hazard risk.","Space geography":"Space geography, or astro-geography, extends geographic concepts and methods to the study of extra-terrestrial surfaces and space environments.","Planetary geography (future)":"Planetary geography applies geographic methods to the study of the surfaces and environments of other planetary bodies.","Urban digital twins":"Urban digital twins are dynamic, data-connected digital replicas of a city, used for simulation, monitoring and planning.","Autonomous drones":"Autonomous drones are unmanned aerial vehicles capable of operating with minimal human control, increasingly used for mapping, monitoring and delivery.","Satellite mega-constellations":"Satellite mega-constellations are large networks of hundreds or thousands of small satellites working together to provide services such as global internet coverage or frequent Earth imaging.","Humanitarian GIS":"Humanitarian GIS applies geographic information systems to support disaster response, refugee assistance and other humanitarian operations.","Climate GIS":"Climate GIS applies geographic information systems to the analysis, visualisation and communication of climate data and impacts.","Health GIS":"Health GIS applies geographic information systems to the analysis of disease patterns, healthcare access and public-health planning.","Precision conservation":"Precision conservation applies fine-scale spatial data and technology to target and optimise conservation actions.","Lunar geography":"Lunar geography, or selenography, is the study of the surface features and physical characteristics of the Moon.","Martian geography":"Martian geography, or areography, is the study of the surface features and physical characteristics of Mars.","Planetary surfaces":"Planetary surfaces are the solid or liquid outer layers of planets and other celestial bodies, studied for their composition, features and processes.","Planetary landforms":"Planetary landforms are surface features, such as craters, volcanoes and canyons, found on planets and moons other than Earth.","Planetary atmospheres":"Planetary atmospheres are the layers of gas surrounding planets and some moons, varying widely in composition, density and dynamics across the Solar System.","Planetary geology":"Planetary geology studies the composition, structure and geological history of planets, moons and other solid celestial bodies.","Planetary mapping":"Planetary mapping is the creation of maps of the surfaces of other planets and moons, typically from orbital or lander imagery.","Remote sensing of planets":"Remote sensing of planets uses instruments aboard orbiters, landers or telescopes to gather data on the surface and atmosphere of other planetary bodies without direct contact.","Asteroid geography":"Asteroid geography studies the surface features and physical characteristics of asteroids.","Space resources":"Space resources refer to materials, such as water ice or minerals, found on the Moon, asteroids or other celestial bodies that could potentially be extracted and used.","Human settlement beyond Earth":"Human settlement beyond Earth refers to the prospect and study of establishing permanent or long-term human habitation on other celestial bodies, such as the Moon or Mars.","Australia":"Australia is both a country and a continent occupying the smallest continental landmass, characterised by an arid interior (the Outback), tropical north, and temperate coastal south and east.","Capital":"A capital is the city officially designated as the seat of a country's or region's government.","Climate":"Climate is the long-term statistical pattern of weather conditions, including average temperature and precipitation and their variability, typical of a place over a period of decades.","Development":"Development refers to progress in a place's economic output, living standards and human welfare over time.","Disaster risk":"Disaster risk is the potential for loss of life, injury or damage that a place faces from the interaction of hazards, exposure and vulnerability.","Energy":"Energy, in a country or city profile, refers to the resources, infrastructure and mix of sources used to meet power needs.","Environmental monitoring":"Environmental monitoring is the ongoing, systematic observation and measurement of environmental conditions to detect change and inform management.","Forest":"A forest is an extensive area of land dominated by tree cover, forming a major terrestrial biome and land-cover type.","Geospatial Intelligence":"Geospatial intelligence is the analysis of imagery and geospatial information to describe, assess and visually depict physical features and activities, ailable to producers, which shape productivity and land use.","Transportation":"Transportation refers to the systems and infrastructure that move people and goods within and between places.","Water":"Water, as a natural resource or locational factor, is essential for drinking, agriculture, industry and ecosystems, and its availability strongly shapes settlement and land use.","Water resources":"Water resources are the surface water and groundwater available to meet human and ecological needs within a given area."};

function termDescription(term, sec){
  if(TERM_INFO[term]) return TERM_INFO[term];
  const ctx=SECTION_CONTEXT[sec.num] || 'geography';
  const t=term.toLowerCase();
  if(/river|lake|water|groundwater|aquifer|wetland|rain|flood|irrigation/.test(t)) return `${term} is studied within ${ctx} by examining its spatial distribution, physical controls, flows, seasonal variability and relationship with people and ecosystems. Geographic analysis commonly maps its extent, measures change through time, identifies upstream–downstream connections and evaluates risks or resource implications.`;
  if(/climate|temperature|wind|cloud|cyclone|drought|humidity|pressure|monsoon|eln|la ni|enso/.test(t)) return `${term} is a component of ${ctx}. Geographers examine how it varies across space and time, the atmospheric or oceanic processes that control it, the scales at which it operates, and its effects on ecosystems, hazards, agriculture, settlements and human activity.`;
  if(/population|migration|urban|city|settlement|poverty|inequality|health|culture|language|religion|gender/.test(t)) return `${term} is analysed in ${ctx} as a spatially uneven human phenomenon. Key questions concern where it is concentrated, how and why its pattern changes, which populations are affected, how flows connect places, and how institutions, environment and economic conditions shape the observed geography.`;
  if(/map|gis|spatial|coordinate|projection|survey|gnss|gps|datum|geoid|raster|vector|remote|satellite|lidar|photogram|point cloud|geocod|python|sql|api/.test(t)) return `${term} is a method, representation or technology used in ${ctx}. Its geographic value lies in locating features accurately, organizing spatial attributes, analysing relationships or change, and communicating results in a form that supports measurement, mapping and decision-making. Correct use requires attention to scale, coordinate reference systems, accuracy, data quality and fitness for purpose.`;
  if(/soil|rock|mineral|mountain|plateau|plain|glacier|desert|erosion|deposition|fault|fold|volcan|tectonic|landform/.test(t)) return `${term} is examined in ${ctx} in terms of its material characteristics, formative processes, spatial distribution and evolution through time. Geographers relate field evidence and mapped patterns to forces such as tectonics, weathering, erosion, deposition, climate and gravity.`;
  if(/agric|crop|food|livestock|forest|fish|mining|industry|trade|market|econom|energy|transport|tourism|resource/.test(t)) return `${term} forms part of ${ctx}. Geographic study focuses on location, resource requirements, accessibility, production and consumption networks, environmental effects, labour and policy, and the uneven benefits and costs produced across regions.`;
  return `${term} is a concept within ${ctx}. Geography studies it by identifying its defining characteristics, mapping where it occurs, explaining the processes and relationships that produce its spatial pattern, comparing it across scales and regions, and examining how it changes over time.`;
}

function whyItMatters(term, sec){
  const ctx=SECTION_CONTEXT[sec.num] || 'geographic analysis';
  return `Why it matters: understanding ${term.toLowerCase()} improves interpretation of ${ctx} and helps connect observed patterns to measurable processes, locations and decisions.`;
}

function renderTree(filter){
  filter=(filter||'').trim().toLowerCase();
  let html='';
  TREE.forEach((part,pi)=>{
    let sectionsHtml='';
    let partMatches=!filter || part.title.toLowerCase().includes(filter);
    part.sections.forEach((sec,si)=>{
      const allItems=sec.items.concat(sec.subs.flatMap(su=>su.items));
      const matchingItems=filter?allItems.filter(it=>it.toLowerCase().includes(filter)):allItems;
      const secMatches=!filter || sec.title.toLowerCase().includes(filter) || matchingItems.length;
      if(secMatches){
        const minis=(filter?matchingItems:allItems).map(it=>`<span class="term-mini" data-part="${pi}" data-sec="${si}" data-term="${encodeURIComponent(it)}">${escapeHtml(it)}</span>`).join('');
        sectionsHtml+=`<div class="section-row" data-part="${pi}" data-sec="${si}"><span class="section-num">${sec.num}</span>${escapeHtml(sec.title)}</div><div class="term-mini-list">${minis}</div>`;
      }
    });
    if(sectionsHtml || partMatches){
      html+=`<div class="part-block ${filter?'':'collapsed'}" data-pi="${pi}"><div class="part-head"><span class="part-roman">${part.roman}</span><span class="part-title">${escapeHtml(part.title)}</span><span class="chev">▸</span></div><div class="sections">${sectionsHtml}</div></div>`;
    }
  });
  treeScroll.innerHTML=html;
  treeScroll.querySelectorAll('.part-head').forEach(el=>el.addEventListener('click',()=>el.closest('.part-block').classList.toggle('collapsed')));
  treeScroll.querySelectorAll('.section-row').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();showSection(+el.dataset.part,+el.dataset.sec);setActive(el);}));
  treeScroll.querySelectorAll('.term-mini').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const pi=+el.dataset.part,si=+el.dataset.sec,term=decodeURIComponent(el.dataset.term);showSection(pi,si,term);}));
}
function setActive(el){treeScroll.querySelectorAll('.section-row').forEach(r=>r.classList.remove('active'));el.classList.add('active');}

function showSection(pi,si,focusTerm){
 const part=TREE[pi],sec=part.sections[si];
 const groups=[];
 if(sec.items.length) groups.push({title:null,items:sec.items});
 sec.subs.forEach(s=>groups.push(s));
 const all=groups.flatMap(g=>g.items);
 let body=`<div class="crumb">PART ${part.roman} · ${escapeHtml(part.title)} <b>›</b> ${sec.num}. ${escapeHtml(sec.title)}</div><h1 class="topic-title">${escapeHtml(sec.title)}</h1><div class="reader-intro">This chapter explains ${escapeHtml(SECTION_CONTEXT[sec.num]||sec.title.toLowerCase())}. It contains ${all.length} core concepts. Use the concept index below to jump directly to any item.</div>`;
 body+=`<div class="section-toc">${all.map(it=>`<button data-target="${slug(it)}">${escapeHtml(it)}</button>`).join('')}</div>`;
 body+=diagramFor(sec);
 groups.forEach(g=>{
   if(g.title) body+=`<div class="subgroup-title">${escapeHtml(g.title)}</div>`;
   body+=`<div class="knowledge-list">`+g.items.map(it=>`<article class="knowledge-card" id="${slug(it)}"><h3>${escapeHtml(it)}</h3><p>${escapeHtml(termDescription(it,sec))}</p><div class="why">${escapeHtml(whyItMatters(it,sec))}</div></article>`).join('')+`</div>`;
 });
 page.innerHTML=body;
 page.querySelectorAll('.section-toc button').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'})));
 document.getElementById('main').scrollTop=0;
 if(focusTerm) setTimeout(()=>document.getElementById(slug(focusTerm))?.scrollIntoView({behavior:'smooth',block:'start'}),0);
 closeMobileSidebar();
}
