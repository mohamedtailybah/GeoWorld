// ---------- Countries & territories ----------
let countryFilter = 'all';
let countryQuery = '';

function fmtArea(km2){
  if(km2 == null) return '—';
  return km2.toLocaleString('en-US', {maximumFractionDigits: km2 < 10 ? 1 : 0}) + ' km²';
}
function fmtPop(p){
  if(p == null) return '—';
  if(p >= 1000000) return '≈' + (p/1000000).toLocaleString('en-US',{maximumFractionDigits:1}) + ' million';
  if(p >= 1000) return '≈' + (p/1000).toLocaleString('en-US',{maximumFractionDigits:1}) + ' thousand';
  return p.toLocaleString('en-US');
}
function fmtCoords(lat, lon){
  if(lat == null || lon == null) return '—';
  const ns = lat >= 0 ? 'N' : 'S', ew = lon >= 0 ? 'E' : 'W';
  return `${Math.abs(lat).toFixed(2)}°${ns}, ${Math.abs(lon).toFixed(2)}°${ew}`;
}
function flagUrl(c){
  return c.iso2 ? `https://flagcdn.com/w80/${c.iso2}.png` : '';
}
function entityRegion(c){
  return c.subregion || c.continent || '';
}

function filteredEntities(){
  const q = countryQuery.trim().toLowerCase();
  return ENTITIES.map((c,i)=>({c,i})).filter(({c})=>{
    if(countryFilter !== 'all' && c.type !== countryFilter) return false;
    if(!q) return true;
    return c.name.toLowerCase().includes(q) ||
           (c.capital||'').toLowerCase().includes(q) ||
           entityRegion(c).toLowerCase().includes(q);
  });
}

function renderCountryList(){
  const list = document.getElementById('country-list');
  const items = filteredEntities();
  list.innerHTML = items.length ? items.map(({c,i})=>
    `<button class="country-btn" data-i="${i}">${escapeHtml(c.name)}<small>${escapeHtml(entityRegion(c))} · ${c.type === 'Country' ? escapeHtml(c.status) : escapeHtml(c.status)}</small></button>`
  ).join('') : `<div class="country-empty">No matches.</div>`;
  list.querySelectorAll('.country-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      list.querySelectorAll('.country-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      showCountry(+btn.dataset.i);
    });
  });
}

function buildCountryList(){
  const list = document.getElementById('country-list');
  list.dataset.built = "1";
  renderCountryList();
  document.getElementById('country-search').addEventListener('input', (e)=>{
    countryQuery = e.target.value;
    renderCountryList();
  });
  document.querySelectorAll('.country-filter').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.country-filter').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      countryFilter = btn.dataset.filter;
      renderCountryList();
    });
  });
}

function showCountryExplorerHome(){
  const unCount = ENTITIES.filter(c=>c.type==='Country').length;
  const otherCount = ENTITIES.filter(c=>c.type==='Territory').length;
  page.innerHTML = `<div class="welcome-hero">

    <h1 class="topic-title">Every place, one common profile.</h1>
    <div class="topic-sub">${ENTITIES.length} countries and territories, each with a common profile: capital, region, coordinates, area, population, terrain, climate, languages, religion and currency. That includes the ${unCount} UN member and UN observer states, plus ${otherCount} non-UN-recognized states, dependencies and other territories. Search, filter or pick one on the left.</div>
    <div class="stat-row">

      <div><div class="n">${unCount}</div><div class="l">UN-recognized states</div></div>

    </div>
  </div>
  <div class="part-index">` +
    ENTITIES.map((c,i)=>`<a data-i="${i}"><b>${escapeHtml(c.name)}</b>${escapeHtml(c.capital||'—')} · ${escapeHtml(entityRegion(c))}</a>`).join('') +
  `</div>`;
  page.querySelectorAll('.part-index a').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.i;
      document.querySelectorAll('.country-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector(`.country-btn[data-i="${i}"]`)?.classList.add('active');
      showCountry(i);
    });
  });
}

function showCountry(i){
  const c = ENTITIES[i];
  const fields = [
    ["Type", c.type],
    ["Recognition status", c.status],
    ["Capital", c.capital],
    ["Continent", c.continent],
    ["Region", entityRegion(c)],
    ["Coordinates", fmtCoords(c.lat, c.lon)],
    ["Area", fmtArea(c.area)],
    ["Population", fmtPop(c.population)],
    ["Coastal / landlocked", c.coastal],
    ["Terrain", c.terrain],
    ["Climate", c.climate],
    ["Language(s)", c.lang],
    ["Religion", c.religion],
    ["Currency", c.currency ? `${c.currency}${c.currency_code ? ' (' + c.currency_code + ')' : ''}` : null],
  ].filter(([,v])=>v);
  const flag = flagUrl(c);
  page.innerHTML = `<div class="crumb">COUNTRY EXPLORER <b>›</b> ${escapeHtml(c.name)}</div>
  <h1 class="topic-title">${flag ? `<img src="${flag}" alt="" class="country-flag" onerror="this.style.display='none'">` : ''}${escapeHtml(c.name)}</h1>
  <div class="topic-sub">Profile fields follow the Part XXIV — Country Geography schema from the master tree. Data covers both UN member/observer states and non-UN-recognized states, dependencies and other territories.</div>
  <div class="profile-grid">` +
    fields.map(([k,v])=>`<div class="profile-field"><div class="k">${escapeHtml(k.toUpperCase())}</div><div class="v">${escapeHtml(v)}</div></div>`).join('') +
  `</div>`;
  document.getElementById('main').scrollTop = 0;
  closeMobileSidebar();
}

<script>
(function(){
  'use strict';

  function allSections(){
    return Array.from(document.querySelectorAll(
      'details, .section, .topic-section, .nav-section, [data-section], [data-collapsible]'
    ));
  }

  function setDetails(open){
    document.querySelectorAll('details').forEach(d => d.open = open);
  }

  function scrollToEdge(which){
    const candidates = [
      document.querySelector('main'),
      document.querySelector('.main'),
      document.querySelector('.content'),
      document.querySelector('#content'),
      document.querySelector('.main-panel')
    ].filter(Boolean);
    const el = candidates[0];
    if(el){
      el.scrollTo({top: which==='top' ? 0 : el.scrollHeight, behavior:'smooth'});
    } else {
      window.scrollTo({top: which==='top' ? 0 : document.documentElement.scrollHeight, behavior:'smooth'});
    }
  }

  // If the sidebar uses details, make the entire summary keyboard/mouse usable.
  document.addEventListener('keydown', function(e){
    if((e.key==='Enter' || e.key===' ') && e.target.matches('summary')){
      e.preventDefault();
      e.target.parentElement.open = !e.target.parentElement.open;
    }
  });

  // Ensure a scrollbar remains visible when content is taller than the viewport.
  function repairOverflow(){
    ['#sidebar','.sidebar','.side-panel','.left-panel','.nav-panel',
     'main','.main','.content','#content','.main-panel'].forEach(sel=>{
      document.querySelectorAll(sel).forEach(el=>{
        el.style.overflowY = 'auto';
        el.style.minHeight = '0';
      });
    });
  }
  repairOverflow();
  window.addEventListener('load', repairOverflow);
  window.addEventListener('resize', repairOverflow);
})();
</script>
